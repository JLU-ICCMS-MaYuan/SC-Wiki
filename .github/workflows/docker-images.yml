name: Build and publish Docker images

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: '目标服务器架构；当前阿里云 x86_64 使用 linux/amd64'
        type: choice
        required: true
        default: linux/amd64
        options:
          - linux/amd64
          - linux/arm64
          - linux/amd64,linux/arm64

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/remote'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: scwiki-frontend
            dockerfile: docker/frontend.Dockerfile
          - image: scwiki-goserver
            dockerfile: docker/goserver.Dockerfile
          - image: scwiki-python
            dockerfile: docker/python.Dockerfile

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up QEMU (支持 linux/arm64 模拟构建)
        if: contains(inputs.platforms, 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: mayuanmark/${{ matrix.image }}
          tags: |
            type=raw,value=remote
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # 按实际服务器选择架构；需要倚天 ECS 或多架构发布时显式选择 arm64。
          platforms: ${{ inputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
