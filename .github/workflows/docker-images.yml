name: Build and publish Docker images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/remote'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: scwiki-frontend
            dockerfile: docker/frontend.Dockerfile
          - image: scwiki-goserver
            dockerfile: docker/goserver.Dockerfile
          - image: scwiki-python
            dockerfile: docker/python.Dockerfile

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up QEMU (支持 linux/arm64 模拟构建)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: mayuanmark/${{ matrix.image }}
          tags: |
            type=raw,value=remote
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # 同时构建 amd64 与 arm64（倚天 ECS 用）；push:true 会自动生成多架构 manifest。
          # arm64 在 amd64 runner 上经 QEMU 模拟，构建较慢，属预期代价。
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
