name: Form contract
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  form-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run test:form-contract --prefix frontend
      - run: npm run test:form-contract:mutation --prefix frontend
      - run: npm run build --prefix frontend
