<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1640" viewBox="0 0 1520 1640" role="img" aria-labelledby="title description">
<title id="title">文献上传黑盒测试流程</title>
<desc id="description">五阶段完整业务流程。任意阶段遇错先留证、核对旧要求并修复，再回到原步骤。排障轮跑通后清理本轮数据并从原文件复测，直到一轮全程无需调试。</desc>
<defs>
<marker id="gray" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker>
<marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#b45348" stroke-width="1.5"/></marker>
<marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#2563a6" stroke-width="1.5"/></marker>
</defs>
<rect width="1520" height="1640" fill="#ffffff"/>
<g font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" fill="#1e293b">
<text x="60" y="65" text-anchor="start" font-size="34" font-weight="600" fill="#1e293b"><tspan x="60" dy="0">文献上传黑盒测试流程</tspan></text>
<text x="60" y="104" text-anchor="start" font-size="19" font-weight="400" fill="#64748b"><tspan x="60" dy="0">通用流程 · 本机原生实时开发 · 上传者与超级管理员</tspan></text>
<rect x="230" y="150" width="600" height="90" rx="14" fill="#f7f8fa" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="530.0" y="182" text-anchor="middle" font-size="21" font-weight="600" fill="#1e293b"><tspan x="530.0" dy="0">开始前：保留已有失败证据</tspan></text>
<text x="530.0" y="211" text-anchor="middle" font-size="18" font-weight="400" fill="#1e293b"><tspan x="530.0" dy="0">只清理本轮文献的旧未送审任务及草稿</tspan></text>
<rect x="230" y="280" width="600" height="85" rx="14" fill="#f7f8fa" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="530.0" y="312" text-anchor="middle" font-size="21" font-weight="600" fill="#1e293b"><tspan x="530.0" dy="0">上传本轮指定原文件</tspan></text>
<text x="530.0" y="341" text-anchor="middle" font-size="18" font-weight="400" fill="#1e293b"><tspan x="530.0" dy="0">核对角色与哈希；同篇文件共同进入一个任务和表单</tspan></text>
<rect x="205" y="390" width="650" height="790" rx="22" fill="none" stroke="#cbd5e1" stroke-dasharray="6 5"/>
<rect x="230" y="410" width="600" height="100" rx="14" fill="#f7f8fa" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="530.0" y="442" text-anchor="middle" font-size="21" font-weight="600" fill="#1e293b"><tspan x="530.0" dy="0">阶段一｜用户解析、校对并送审</tspan></text>
<text x="530.0" y="471" text-anchor="middle" font-size="18" font-weight="400" fill="#1e293b"><tspan x="530.0" dy="0">按原文检查科学内容与来源</tspan><tspan x="530.0" dy="26">保存、重读，完成必要审核后送审</tspan></text>
<rect x="230" y="560" width="600" height="120" rx="14" fill="#f7f8fa" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="530.0" y="592" text-anchor="middle" font-size="21" font-weight="600" fill="#1e293b"><tspan x="530.0" dy="0">阶段二｜超级管理员审核并退回</tspan></text>
<text x="530.0" y="621" text-anchor="middle" font-size="18" font-weight="400" fill="#1e293b"><tspan x="530.0" dy="0">完成审核操作，记录两项具体修改意见</tspan><tspan x="530.0" dy="23">① 论文级信息　② 材料状态中的现有字段</tspan><tspan x="530.0" dy="23">重新读取拒绝状态、意见和交接历史</tspan></text>
<rect x="230" y="730" width="600" height="110" rx="14" fill="#f7f8fa" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="530.0" y="762" text-anchor="middle" font-size="21" font-weight="600" fill="#1e293b"><tspan x="530.0" dy="0">阶段三｜用户返修并重新送审</tspan></text>
<text x="530.0" y="791" text-anchor="middle" font-size="18" font-weight="400" fill="#1e293b"><tspan x="530.0" dy="0">按退回意见修改两项内容，保留原文依据</tspan><tspan x="530.0" dy="26">按规则补理由和依据；保存、重读、核对、重提</tspan></text>
<rect x="230" y="890" width="600" height="100" rx="14" fill="#f7f8fa" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="530.0" y="922" text-anchor="middle" font-size="21" font-weight="600" fill="#1e293b"><tspan x="530.0" dy="0">阶段四｜超级管理员复核并批准</tspan></text>
<text x="530.0" y="951" text-anchor="middle" font-size="18" font-weight="400" fill="#1e293b"><tspan x="530.0" dy="0">核查返修内容，填写真实通过日志</tspan><tspan x="530.0" dy="26">重新读取批准状态、审核人和正式内容</tspan></text>
<rect x="230" y="1040" width="600" height="110" rx="14" fill="#f7f8fa" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="530.0" y="1072" text-anchor="middle" font-size="21" font-weight="600" fill="#1e293b"><tspan x="530.0" dy="0">阶段五｜探索检索和正式数据核验</tspan></text>
<text x="530.0" y="1101" text-anchor="middle" font-size="18" font-weight="400" fill="#1e293b"><tspan x="530.0" dy="0">打开本轮论文，核对 ID、DOI、状态和材料状态</tspan><tspan x="530.0" dy="26">只读核验主要数据、所选来源及原文件关联</tspan></text>
<path d="M530 240V280" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#gray)"/>
<path d="M530 365V410" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#gray)"/>
<path d="M530 510V560" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#gray)"/>
<path d="M530 680V730" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#gray)"/>
<path d="M530 840V890" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#gray)"/>
<path d="M530 990V1040" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#gray)"/>
<path d="M530 1150V1195" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#gray)"/>
<path d="M530 1195L830 1260L530 1325L230 1260Z" fill="#edf5ff" stroke="#5b8fc7" stroke-width="1.8"/>
<text x="530" y="1250" text-anchor="middle" font-size="21" font-weight="600" fill="#1e293b"><tspan x="530" dy="0">这是否是重新上传后的复测轮，</tspan><tspan x="530" dy="30">而且全程无需调试？</tspan></text>
<path d="M530 1325V1370" fill="none" stroke="#2563a6" stroke-width="2" marker-end="url(#blue)"/>
<text x="535" y="1353" text-anchor="start" font-size="17" font-weight="400" fill="#2563a6"><tspan x="535" dy="0">否：排障轮，或复测仍需调试</tspan></text>
<rect x="230" y="1370" width="600" height="110" rx="14" fill="#edf5ff" stroke="#5b8fc7" stroke-width="1.5"/>
<text x="530.0" y="1402" text-anchor="middle" font-size="21" font-weight="600" fill="#1e293b"><tspan x="530.0" dy="0">整轮留证后，清理本轮数据</tspan></text>
<text x="530.0" y="1431" text-anchor="middle" font-size="18" font-weight="400" fill="#1e293b"><tspan x="530.0" dy="0">只清理该轮表单、入库论文和对应解析数据</tspan><tspan x="530.0" dy="26">保留证据和原文件，不影响其他论文及共享记录</tspan></text>
<path d="M230 1425H125V322H230" fill="none" stroke="#2563a6" stroke-width="2" marker-end="url(#blue)"/>
<text x="103" y="940" text-anchor="middle" font-size="18" font-weight="500" fill="#2563a6"><tspan x="103" dy="0">从</tspan><tspan x="103" dy="27">原</tspan><tspan x="103" dy="27">文</tspan><tspan x="103" dy="27">件</tspan><tspan x="103" dy="27">重</tspan><tspan x="103" dy="27">测</tspan></text>
<path d="M830 1260H1010" fill="none" stroke="#2563a6" stroke-width="2" marker-end="url(#blue)"/>
<text x="920" y="1243" text-anchor="middle" font-size="20" font-weight="600" fill="#2563a6"><tspan x="920" dy="0">是</tspan></text>
<rect x="1010" y="1215" width="420" height="100" rx="14" fill="#edf8f0" stroke="#6f9b7b" stroke-width="1.5"/>
<text x="1220.0" y="1247" text-anchor="middle" font-size="21" font-weight="600" fill="#1e293b"><tspan x="1220.0" dy="0">保留最终论文与全部证据</tspan></text>
<text x="1220.0" y="1276" text-anchor="middle" font-size="18" font-weight="400" fill="#1e293b"><tspan x="1220.0" dy="0">五阶段完成，结束本次黑盒测试</tspan></text>
<rect x="1010" y="270" width="420" height="820" rx="20" fill="#fffaf8" stroke="#ddc6c0"/>
<text x="1220" y="309" text-anchor="middle" font-size="23" font-weight="600" fill="#91443b"><tspan x="1220" dy="0">任一步骤遇到问题</tspan></text>
<rect x="1050" y="345" width="340" height="85" rx="14" fill="#ffffff" stroke="#ddc6c0" stroke-width="1.5"/>
<text x="1220.0" y="377" text-anchor="middle" font-size="21" font-weight="600" fill="#1e293b"><tspan x="1220.0" dy="0">先保留失败证据</tspan></text>
<text x="1220.0" y="406" text-anchor="middle" font-size="18" font-weight="400" fill="#1e293b"><tspan x="1220.0" dy="0">页面、响应、日志和任务身份</tspan></text>
<rect x="1050" y="470" width="340" height="100" rx="14" fill="#ffffff" stroke="#ddc6c0" stroke-width="1.5"/>
<text x="1220.0" y="502" text-anchor="middle" font-size="21" font-weight="600" fill="#1e293b"><tspan x="1220.0" dy="0">先查旧要求和完整调用链</tspan></text>
<text x="1220.0" y="531" text-anchor="middle" font-size="18" font-weight="400" fill="#1e293b"><tspan x="1220.0" dy="0">原始要求、Issue、Spec、Overview</tspan><tspan x="1220.0" dy="26">对照代码、历史和运行环境</tspan></text>
<rect x="1050" y="610" width="340" height="110" rx="14" fill="#ffffff" stroke="#ddc6c0" stroke-width="1.5"/>
<text x="1220.0" y="642" text-anchor="middle" font-size="21" font-weight="600" fill="#1e293b"><tspan x="1220.0" dy="0">按问题性质处理</tspan></text>
<text x="1220.0" y="671" text-anchor="middle" font-size="18" font-weight="400" fill="#1e293b"><tspan x="1220.0" dy="0">旧要求遗漏、实现错误：修复</tspan><tspan x="1220.0" dy="26">改变规则或设计：先由用户审查</tspan></text>
<rect x="1050" y="760" width="340" height="100" rx="14" fill="#ffffff" stroke="#ddc6c0" stroke-width="1.5"/>
<text x="1220.0" y="792" text-anchor="middle" font-size="21" font-weight="600" fill="#1e293b"><tspan x="1220.0" dy="0">验证受影响的真实链路</tspan></text>
<text x="1220.0" y="821" text-anchor="middle" font-size="18" font-weight="400" fill="#1e293b"><tspan x="1220.0" dy="0">先证明回归能检出，再验证修复</tspan><tspan x="1220.0" dy="26">PDF 字段从原文件重跑受影响步骤</tspan></text>
<rect x="1050" y="900" width="340" height="100" rx="14" fill="#edf5ff" stroke="#5b8fc7" stroke-width="1.5"/>
<text x="1220.0" y="932" text-anchor="middle" font-size="21" font-weight="600" fill="#1e293b"><tspan x="1220.0" dy="0">回到发生问题的步骤</tspan></text>
<text x="1220.0" y="961" text-anchor="middle" font-size="18" font-weight="400" fill="#1e293b"><tspan x="1220.0" dy="0">确认修复生效后继续往后走</tspan><tspan x="1220.0" dy="26">当前轮不因每次修复删稿重传</tspan></text>
<path d="M1220 430V470" fill="none" stroke="#b45348" stroke-width="2" marker-end="url(#red)"/>
<path d="M1220 570V610" fill="none" stroke="#b45348" stroke-width="2" marker-end="url(#red)"/>
<path d="M1220 720V760" fill="none" stroke="#b45348" stroke-width="2" marker-end="url(#red)"/>
<path d="M1220 860V900" fill="none" stroke="#b45348" stroke-width="2" marker-end="url(#red)"/>
<path d="M855 460H920" fill="none" stroke="#b45348" stroke-width="1.5" stroke-dasharray="5 5"/>
<path d="M855 620H920" fill="none" stroke="#b45348" stroke-width="1.5" stroke-dasharray="5 5"/>
<path d="M855 785H920" fill="none" stroke="#b45348" stroke-width="1.5" stroke-dasharray="5 5"/>
<path d="M855 940H920" fill="none" stroke="#b45348" stroke-width="1.5" stroke-dasharray="5 5"/>
<path d="M855 1095H920" fill="none" stroke="#b45348" stroke-width="1.5" stroke-dasharray="5 5"/>
<path d="M920 387V1095" fill="none" stroke="#b45348" stroke-width="1.5" stroke-dasharray="5 5"/>
<path d="M920 387H1050" fill="none" stroke="#b45348" stroke-width="2" marker-end="url(#red)" stroke-dasharray="6 5"/>
<text x="1220" y="1042" text-anchor="middle" font-size="18" font-weight="500" fill="#2563a6"><tspan x="1220" dy="0">一轮内保持同一论文身份</tspan></text>
<text x="60" y="1542" text-anchor="start" font-size="19" font-weight="400" fill="#1e293b"><tspan x="60" dy="0">正常人工校对、退回、返修和批准照常进行；最终复测轮不靠修代码、后台补数据或临时脚本修结果。</tspan></text>
<text x="60" y="1584" text-anchor="start" font-size="22" font-weight="600" fill="#91443b"><tspan x="60" dy="0">AI 只能填写既定字段的值，不能新增字段键。</tspan></text>
</g></svg>
