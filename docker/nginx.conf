server {
    listen 80;

    # 论文 PDF 通常超过 Nginx 默认 1 MB 请求体上限。
    client_max_body_size 50M;

    # 前端静态文件
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 代理 → Go
    location /api/ {
        proxy_pass http://goserver:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location ~ ^/api/rag/upload-(pdf|text)$ {
        # 50 MiB 文件还包含少量 multipart 边界；精确文件上限由 Python 校验。
        client_max_body_size 51M;
        proxy_pass http://goserver:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_request_buffering off;
    }

    # canonical 多文件上传：multipart 请求体略大于文件本身。
    location ~ "^/api/upload-tasks/[0-9a-f]{32}/files/[0-9a-f]{32}$" {
        client_max_body_size 51M;
        proxy_pass http://goserver:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_request_buffering off;
    }

    # 健康检查
    location /health {
        proxy_pass http://goserver:8080;
    }
}
