services:
  worker:
    extends: {file: compose.runtime.yaml, service: python-base}
    command: ["python", "-m", "backend.scripts.run_upload_workers"]
    volumes: ["compute-scratch:/data", "compute-models:/models"]
    mem_limit: 8g
    cpus: 2.5
  grobid:
    image: ${GROBID_IMAGE:?}
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8070/api/isalive >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
volumes:
  compute-scratch:
    name: ${DEPLOYMENT_ID:?}_compute-scratch
    external: true
  compute-models:
    name: ${DEPLOYMENT_ID:?}_compute-models
    external: true
networks:
  default:
    name: ${DEPLOYMENT_ID:?}_internal
    external: true
