services:
  # ────── 前端 + 反向代理 ──────
  frontend:
    image: mayuanmark/scwiki-frontend:mayuan
    ports:
      - "80:80"
    depends_on:
      - goserver
    restart: unless-stopped

  # ────── Go API ──────
  goserver:
    image: mayuanmark/scwiki-goserver:mayuan
    environment:
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      PYTHON_BACKEND_URL: http://python:8000
      REDIS_ADDR: redis:6379
      SC_WIKI_DATA_DIR: /data
      AVATAR_DIR: /data/avatars
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
    volumes:
      - ./data/graph.json:/data/graph.json
      - ./data/clean_results:/data/clean_results
      - ./data/avatars:/data/avatars
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # ────── Python RAG ──────
  python:
    image: mayuanmark/scwiki-python:mayuan
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RAG_DATABASE_URL: ${RAG_DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      REDIS_URL: redis://redis:6379/0
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_PROVIDER_NAME: ${LLM_PROVIDER_NAME:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL}
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      GROBID_URL: http://grobid:8070
      SC_WIKI_DATA_DIR: /data
    volumes:
      - ./data/uploads:/data/uploads
      - ./data/clean_results:/data/clean_results
      - ./data/upload_PDFs:/data/upload_PDFs
      - ./data/parsed_markdown:/data/parsed_markdown
      - ./data/review_artifacts:/data/review_artifacts
      - ./data/runtime:/data/runtime
      - ./data/property_name_mapping.json:/data/property_name_mapping.json
      - ./data/prop_name_ai_cache.json:/data/prop_name_ai_cache.json
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      grobid:
        condition: service_healthy
    restart: unless-stopped

  # ────── 数据库迁移（与 Python API 使用同一镜像） ──────
  migrate:
    image: mayuanmark/scwiki-python:mayuan
    command: ["python", "-m", "backend.scripts.run_migrations"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  # ────── 论文上传任务 Worker（与 Python API 使用同一镜像） ──────
  worker:
    image: mayuanmark/scwiki-python:mayuan
    command: ["python", "-m", "backend.scripts.run_upload_workers"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RAG_DATABASE_URL: ${RAG_DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      REDIS_URL: redis://redis:6379/0
      UPLOAD_LLM_CONCURRENCY: ${UPLOAD_LLM_CONCURRENCY:-2}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_PROVIDER_NAME: ${LLM_PROVIDER_NAME:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL}
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      GROBID_URL: http://grobid:8070
      SC_WIKI_DATA_DIR: /data
    volumes:
      - ./data/uploads:/data/uploads
      - ./data/clean_results:/data/clean_results
      - ./data/upload_PDFs:/data/upload_PDFs
      - ./data/parsed_markdown:/data/parsed_markdown
      - ./data/review_artifacts:/data/review_artifacts
      - ./data/runtime:/data/runtime
      - ./data/property_name_mapping.json:/data/property_name_mapping.json
      - ./data/prop_name_ai_cache.json:/data/prop_name_ai_cache.json
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      grobid:
        condition: service_healthy
    restart: unless-stopped

  # ────── 自动资讯调度（每天北京时间 08:00 入队） ──────
  news-scheduler:
    image: mayuanmark/scwiki-python:mayuan
    command: ["python", "-m", "backend.news", "schedule"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      NEWS_DAILY_HOUR: "8"
      NEWS_TIMEZONE: Asia/Shanghai
      NEWS_INITIAL_DAYS: "7"
      NEWS_MAX_PAGES: "100"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ────── 自动资讯采集 Worker（仅消费 scwiki-news） ──────
  news-worker:
    image: mayuanmark/scwiki-python:mayuan
    command: ["python", "-m", "backend.news", "worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      NEWS_DAILY_HOUR: "8"
      NEWS_TIMEZONE: Asia/Shanghai
      NEWS_INITIAL_DAYS: "7"
      NEWS_MAX_PAGES: "100"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ────── 数据库 ──────
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ────── 缓存 ──────
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ────── 知识图谱 ──────
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_server_memory_pagecache_size: 512M
      NEO4J_server_memory_heap_initial__size: 512M
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER}", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ────── 学术 PDF 结构化解析 ──────
  grobid:
    image: lfoppiano/grobid:0.8.1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8070/api/isalive >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ────── 向量数据库 ──────
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD", "/usr/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333; printf 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; IFS= read -r response <&3; [[ $$response == *' 200 '* ]]"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
