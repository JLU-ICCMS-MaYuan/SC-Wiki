<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SC-Wiki · 三引擎互补核对</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#18312e;background:#f5f7f6;font-size:14px;line-height:1.6}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,select{cursor:pointer}button{background:white;border:1px solid #ccd8d3;border-radius:7px;padding:7px 12px;color:inherit}button:hover{background:#edf4ef}header{background:#102f2b;color:#f5fff9;padding:27px 36px}header small{letter-spacing:2px;color:#9bc9b7}h1{margin:5px 0;font-size:27px;font-weight:600}header p{margin:5px 0;color:#bcd1c9}main{max-width:1560px;margin:auto;padding:22px 30px}h2{font-size:20px;margin:5px 0 15px}h3{font-size:15px;margin:0 0 12px}.toolbar,.tabs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:15px}.tabs button.active{background:#1d6555;border-color:#1d6555;color:white}.notice{background:#fff7e8;border:1px solid #efd9b0;padding:12px 16px;border-radius:8px;margin-bottom:18px}.muted{color:#63766e;font-size:12px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.metric{background:white;border:1px solid #dce5e0;border-radius:10px;padding:13px 16px}.metric strong{font-size:24px;display:block;color:#215f4d}.panel{background:white;border:1px solid #dbe5df;border-radius:10px;padding:19px;margin-bottom:16px}.group{border-top:1px solid #dce5e0;padding-top:18px;margin-top:18px}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.field{min-width:0}.field.wide{grid-column:1/-1}.label{color:#547067;font-size:12px;display:block;margin-bottom:4px;overflow-wrap:anywhere}.value{background:#f7f9f8;border:1px solid #dce5e0;border-radius:6px;padding:9px 11px;min-height:41px;white-space:pre-wrap;overflow-wrap:anywhere}.field-actions{display:flex;gap:5px;align-items:center;margin-top:5px;font-size:11px}.field-actions button{font-size:11px;padding:2px 7px}.field-actions select{max-width:100px;border:0;background:#edf3ef;color:#45655a;border-radius:4px;padding:3px}.reason{width:100%;border:1px solid #ccd8d3;border-radius:5px;padding:5px;margin-top:5px;font-size:12px}.tag{background:#e6f2eb;border-radius:4px;padding:2px 7px;font-size:11px}.bad{background:#fae8e5;color:#9e3326}.unknown{background:#fff1d6;color:#8c6215}.scroll{overflow:auto;max-height:700px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;vertical-align:top;border-bottom:1px solid #e1e8e3;padding:10px;overflow-wrap:anywhere}th{background:#eff4f1;position:sticky;top:0}td{max-width:270px;min-width:150px}td:first-child{min-width:220px}td button{font-size:11px;margin-top:4px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;max-height:500px;overflow:auto}details{margin-top:12px}summary{cursor:pointer;color:#2c6d57}input[type=search]{border:1px solid #cbdad1;border-radius:6px;padding:8px 12px;min-width:300px}dialog{border:1px solid #bdcfc4;border-radius:13px;width:min(1100px,95vw);max-height:93vh;padding:22px}dialog::backdrop{background:#0c211ba8}.source-grid{display:grid;grid-template-columns:1fr 1.4fr;gap:18px}.page-image{position:relative}.page-image img{width:100%;display:block}.page-image svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.close{float:right}.empty{padding:30px;color:#65786f;text-align:center}footer{padding:15px 0;color:#73857c;font-size:12px}.hidden{display:none!important}@media(max-width:850px){header{padding:20px}main{padding:14px}.fields{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:1fr 1fr}.source-grid{grid-template-columns:1fr}}@media(max-width:500px){.fields{grid-template-columns:1fr}input[type=search]{min-width:0;width:100%}}
</style></head><body>
<header><small>SC-WIKI / PARSING LAB</small><h1>三引擎互补 · 文献核对</h1><p>真实解析 → 同一模型提取 → 字段、证据与遗漏核对</p></header>
<main><div class="toolbar"><span id="run" class="muted"></span><button id="export">导出核对记录</button><button id="import">导入核对记录</button><input id="import-file" type="file" accept="application/json" hidden><span id="message" role="status"></span></div>
<div class="notice">这是独立实验。四路标签用于对照结果；生产默认流程尚未修改。<b>来源可定位不等于科学值正确</b>，未核对字段不计入正确率。</div>
<div id="metrics" class="metrics"></div><div class="tabs" id="views"></div><div id="content"></div>
<footer id="footer"></footer></main>
<dialog id="source-dialog"><button class="close" id="close-source">关闭</button><h2>原文与区域证据</h2><div id="source-content"></div></dialog>
<dialog id="review-dialog"><button class="close" id="close-review">关闭导出</button><h2>导出核对记录</h2><p>下载 JSON，或复制下方完整内容保存。记录绑定当前运行与候选版本。</p><textarea id="review-json" aria-label="核对记录 JSON" readonly rows="14" style="width:100%"></textarea><a id="review-download">下载 JSON 文件</a></dialog>
<script type="application/json" id="report-data">__REPORT_JSON__</script>
<script>
"use strict";
const R=JSON.parse(document.getElementById('report-data').textContent), arms=['docling','mineru','marker','complementary'];
const names={docling:'Docling',mineru:'MinerU',marker:'Marker',complementary:'互补结果'},stateNames={correct:'正确',incorrect:'错误',missing:'遗漏',not_applicable:'不适用',unknown:'未核对 / 无法判断'};
const labels={title:'论文标题',doi:'DOI',authors:'作者',journal:'期刊',year:'年份',volume:'卷号',issue_number:'期号',pages:'页码',abstract:'原始摘要',paper_type:'论文类型',superconductor_kind:'超导体类别',material_families:'材料家族',summary:'论文总结',keywords_tags:'关键词',methodology:'研究方法',key_finding:'主要发现',research_motivation:'研究动机',knowledge_graph_title:'知识图谱标题',material:'化学式',material_name:'材料名',state_kind:'状态类型',pressure_value_gpa:'压力 / GPa',pressure_raw:'原始压力',reported_space_group_symbol:'报告空间群',reported_space_group_number:'空间群号',material_dimensionality:'材料维度',value_number:'数值',value_min:'范围下界',value_max:'范围上界',value_kind:'值类型',value_raw:'原始值',name_raw:'名称',method_code:'方法',method_raw:'原文方法',unit_raw:'原文单位',canonical_unit:'标准单位',lambda_ep:'λ',omega_log:'ωlog',mu_star:'μ*',k_grid:'k 网格',q_grid:'q 网格',calculation_code:'计算软件',exchange_correlation:'交换关联',note:'备注'};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),display=v=>v===null||v===undefined||v===''?'未提取':typeof v==='object'?JSON.stringify(v,null,2):String(v);
const auditID=(arm,id)=>'audit:'+arm+':'+R.forms[arm].attempt+':'+id;
const validIDs=new Set([...R.fields.map(f=>f.id),...(R.evaluation?.items||[]).flatMap(x=>arms.map(a=>auditID(a,x.id)))]),storageKey='scwiki-136:'+R.run_id;let reviews={},view='complementary';
try{reviews=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch(e){reviews={}}
function save(){try{localStorage.setItem(storageKey,JSON.stringify(reviews))}catch(e){$('#message').textContent='本地存储不可用，请导出核对记录'}metrics()}
function metrics(){const counts={correct:0,incorrect:0,missing:0,not_applicable:0,unknown:0};R.fields.forEach(f=>counts[reviews[f.id]?.status||'unknown']++);$('#metrics').innerHTML=[['候选字段',R.fields.length],['已标正确',counts.correct],['错误 / 遗漏',counts.incorrect+' / '+counts.missing],['未核对 / 无法判断',counts.unknown]].map(([k,v])=>`<div class="metric"><span>${k}</span><strong>${v}</strong></div>`).join('')}
function sourceButton(f){return `<button data-source="${esc(f.id)}">${f.evidences?.length?'查看 '+f.evidences.length+' 条证据':'缺少字段证据'}</button>`}
function fieldHTML(f){const parts=f.path.split('/'),last=parts.at(-1),label=/^\d+$/.test(last)?(labels[parts.at(-2)]||parts.at(-2))+' '+(Number(last)+1):(labels[last]||last),rv=reviews[f.id]||{},long=display(f.value).length>160;return `<div class="field ${long?'wide':''}"><label class="label" title="${esc(f.path)}">${esc(label)}</label><div class="value">${esc(display(f.value))}</div><div class="field-actions">${sourceButton(f)}<select aria-label="核对 ${esc(f.path)}" data-review="${f.id}">${Object.entries(stateNames).map(([k,v])=>`<option value="${k}" ${(rv.status||'unknown')===k?'selected':''}>${v}</option>`).join('')}</select></div><input class="reason ${rv.status&&rv.status!=='unknown'?'':'hidden'}" data-reason="${f.id}" aria-label="核对理由 ${esc(f.path)}" placeholder="记录判断理由和原文依据" value="${esc(rv.reason||'')}"></div>`}
function rawDetails(title,value){return `<details><summary>${esc(title)}</summary><pre>${esc(JSON.stringify(value,null,2))}</pre></details>`}
function showForm(arm){const f=R.forms[arm],fields=R.fields.filter(x=>x.arm===arm),groups=new Map;fields.forEach(x=>{const key=x.section+'|'+x.group;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(x)});let html=`<div class="panel"><h2>${names[arm]} <span class="tag ${f.status==='failed'?'bad':'unknown'}">${esc(f.status==='needs_review'?'待科学核对':f.status==='failed'?'提取失败':'未运行')}</span></h2><p class="muted">契约：${f.validation.contract_valid?'通过':'未通过或未执行'} · 引句未定位：${f.validation.evidence_invalid??'—'} / ${f.validation.evidence_total??'—'} · 模型：${esc(f.call?.model||'—')} · 用时：${f.call?.elapsed_seconds??'—'} 秒</p>`;if(!fields.length)html+='<p class="empty">暂无通过契约的表单。原始响应和失败信息仍可在下方查看。</p>';let last='';for(const [key,rows] of groups){const section=rows[0].section;if(last!==section){html+=`<h2 class="group">${{paper:'论文信息',state:'材料状态',record:'物性记录与条件',structure:'结构候选（未生成已验证结构）'}[section]}</h2>`;last=section}html+=`<div class="group"><h3>${esc(rows[0].group)}</h3><div class="fields">${rows.map(fieldHTML).join('')}</div></div>`}html+=rawDetails('字段冲突（模型申报，仍需复核）',f.conflicts||[])+rawDetails('完整原始模型候选',f.raw||{})+rawDetails('校验详情',f.validation)+'</div>';$('#content').innerHTML=html}
function comparisonHTML(query='',only=false){return `<div class="scroll"><table><thead><tr><th>实体 / 字段</th>${arms.map(a=>`<th>${names[a]}</th>`).join('')}</tr></thead><tbody>${R.comparisons.filter(x=>(!only||x.different)&&x.key.toLowerCase().includes(query.toLowerCase())).map(x=>`<tr><td>${esc(x.key)} ${x.different?'<span class="tag unknown">差异</span>':''}</td>${arms.map(a=>{const f=x.fields[a];return `<td>${esc(f?display(f.value):'本路未提取该字段')}${f?'<br>'+sourceButton(f):''}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`}
function showCompare(){const d=R.comparisons.filter(x=>x.different).length;$('#content').innerHTML=`<div class="panel"><h2>逐字段差异</h2><p class="muted">${d} / ${R.comparisons.length} 个对齐字段存在差异或缺项。差异不等于错误；同条件重复条目、未提取身份字段和结构候选对应关系需人工核对。</p><div class="toolbar"><input id="search" type="search" placeholder="检索字段、材料或方法"><label><input id="only-diff" type="checkbox"> 只看差异</label></div><div id="comparison-table">${comparisonHTML()}</div></div>`}
function showCoverage(){let html='<div class="panel"><h2>来源覆盖与遗漏候选</h2><p class="muted">引用候选不代表语义正确；模型排除不代表人工同意；未覆盖项保留为待核对。</p>';for(const arm of arms){const rows=R.forms[arm].coverage||[];html+=`<details><summary>${names[arm]}：${rows.length} 项，未处置 ${rows.filter(r=>r.status==='unreviewed').length} 项</summary><div class="scroll"><table><tr><th>来源</th><th>内容</th><th>处置与原因</th></tr>${rows.map((r,i)=>`<tr><td>${esc(r.file_id)} p.${r.pdf_page} ${esc(r.kind)}<br><button data-coverage="${arm}:${i}">打开来源页</button></td><td>${esc(r.text)}</td><td>${esc(r.status)}<br>${esc(r.reason)}</td></tr>`).join('')}</table></div></details>`}$('#content').innerHTML=html+'</div>'}
function showRun(){const html=`<div class="panel"><h2>真实运行与互补路径</h2><div class="scroll"><table><tr><th>引擎 / 文件</th><th>实际版本</th><th>状态 / 耗时</th><th>原始结果</th></tr>${R.parses.map(p=>`<tr><td>${esc(p.engine)} / ${esc(p.file_id)}</td><td>${esc(p.runtime?.version||'—')}</td><td>${esc(p.status)} / ${p.elapsed_seconds}s</td><td><a href="${esc(p.engine)}/${esc(p.file_id)}/raw.json">raw.json</a></td></tr>`).join('')}</table></div>${rawDetails('输入身份',R.case)}${rawDetails('全部区域对齐与候选选择（空间对齐不是语义一致）',R.routing)}</div>`;$('#content').innerHTML=html}
function showEvaluation(){const e=R.evaluation;if(!e){$('#content').innerHTML='<div class="panel"><h2>独立核对清单</h2><p>尚无独立核对结论，不把模型输出数当作正确数。</p></div>';return}const statistics=arms.map(a=>`<div class="metric"><span>${names[a]}</span><strong>${e.counts[a].correct||0} / ${e.denominator}</strong><small>错误 ${e.counts[a].incorrect||0} · 遗漏 ${e.counts[a].missing||0}</small></div>`).join('');const changes=Object.entries(e.changes).map(([a,c])=>`相较 ${names[a]}：改善 ${c.improved.length} 项，退步 ${c.regressed.length} 项`).join('；');$('#content').innerHTML=`<div class="panel"><h2>独立核对清单与改善 / 退步</h2><p>${esc(e.scope)}</p><p class="muted">${esc(e.reference)}</p><div class="metrics">${statistics}</div><div class="notice">${esc(changes)}。这些是助手核对结果，尚未获得用户验收。</div><div class="scroll"><table><thead><tr><th>检查项 / 原文参考</th>${arms.map(a=>`<th>${names[a]}</th>`).join('')}</tr></thead><tbody>${e.items.map(r=>`<tr><td><b>${esc(r.id+' '+r.label)}</b><br>参考：${esc(display(r.expected))}<br><span class="muted">${esc(r.source)}</span></td>${arms.map(a=>{const result=r.results[a],id=auditID(a,r.id),rv=reviews[id]||{};return `<td><span class="tag ${result.status==='correct'?'':result.status==='incorrect'?'bad':'unknown'}">${esc(stateNames[result.status])}</span><pre>${esc(JSON.stringify(result.actual))}</pre><span class="muted">${esc(result.reason)}</span><br><select data-review="${id}" aria-label="人工核对 ${a} ${r.id}">${Object.entries(stateNames).map(([k,v])=>`<option value="${k}" ${(rv.status||'unknown')===k?'selected':''}>${v}</option>`).join('')}</select><input class="reason ${rv.status&&rv.status!=='unknown'?'':'hidden'}" data-reason="${id}" aria-label="人工核对理由 ${a} ${r.id}" placeholder="写下核对理由，可导出" value="${esc(rv.reason||'')}"></td>`}).join('')}</tr>`).join('')}</tbody></table></div>${rawDetails('完整核对 JSON',e)}</div>`}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(arms.includes(view))showForm(view);else if(view==='compare')showCompare();else if(view==='coverage')showCoverage();else if(view==='evaluation')showEvaluation();else showRun()}
function sourceHTML(e){const block=R.sources[e.file_id+':'+e.block_id],page=R.pages[e.file_id+':'+e.pdf_page];const bbox=block?.bbox,matches=!!block&&block.pdf_page===e.pdf_page&&!!e.quote&&block.text.replace(/\s+/g,' ').includes(e.quote.replace(/\s+/g,' '));return `<div class="source-grid"><div><h3>${esc(e.file_id)} · PDF 第 ${e.pdf_page} 页 · ${esc(block?.engine||'未知引擎')}</h3><p>${esc(e.quote||'此项尚无字段引句，展示来源内容供核对')}</p><span class="tag ${matches?'':'unknown'}">${matches?'引句可定位':'引句未定位 / 待核对'}</span><p class="muted">来源块存在及高亮区域均不代表字段已获语义支持。</p>${rawDetails('原始块文本',block?.text||'未找到')}<pre>${esc(e.block_id)}</pre></div><div>${page?`<div class="page-image"><img src="${esc(page.image)}" alt="${esc(e.file_id)} 第 ${e.pdf_page} 页">${bbox?`<svg viewBox="0 0 ${page.width} ${page.height}"><rect x="${bbox[0]}" y="${bbox[1]}" width="${bbox[2]-bbox[0]}" height="${bbox[3]-bbox[1]}" fill="#f4b40033" stroke="#de5b25" stroke-width="1.4"/></svg>`:''}</div>`:'无页面图像'}</div></div>`}
function openSources(evidences){$('#source-content').innerHTML=evidences?.length?evidences.map(sourceHTML).join('<hr>'):'<p>当前字段没有提供可定位证据，保持未核对。</p>';$('#source-dialog').showModal()}
document.addEventListener('click',event=>{const t=event.target.closest('button');if(!t)return;if(t.dataset.view){view=t.dataset.view;render()}if(t.dataset.source)openSources(R.fields.find(f=>f.id===t.dataset.source)?.evidences);if(t.dataset.coverage){const [a,i]=t.dataset.coverage.split(':');openSources([R.forms[a].coverage[Number(i)]])}});
document.addEventListener('change',event=>{const t=event.target;if(t.dataset.review){const old=reviews[t.dataset.review]||{};reviews[t.dataset.review]={...old,status:t.value,updated_at:new Date().toISOString()};save();const reason=document.querySelector(`[data-reason="${t.dataset.review}"]`);reason.classList.toggle('hidden',t.value==='unknown')}if(t.id==='only-diff')$('#comparison-table').innerHTML=comparisonHTML($('#search').value,t.checked)});
document.addEventListener('input',event=>{const t=event.target;if(t.dataset.reason){reviews[t.dataset.reason]={...(reviews[t.dataset.reason]||{status:'unknown'}),reason:t.value,updated_at:new Date().toISOString()};save()}if(t.id==='search')$('#comparison-table').innerHTML=comparisonHTML(t.value,$('#only-diff').checked)});
$('#close-source').onclick=()=>$('#source-dialog').close();
let exportURL=null;$('#export').onclick=()=>{const text=JSON.stringify({schema_version:1,run_id:R.run_id,records:reviews},null,2);$('#review-json').value=text;if(exportURL)URL.revokeObjectURL(exportURL);exportURL=URL.createObjectURL(new Blob([text],{type:'application/json'}));$('#review-download').href=exportURL;$('#review-download').download='reviews-'+R.run_id+'.json';$('#review-dialog').showModal()};$('#close-review').onclick=()=>$('#review-dialog').close();
$('#import').onclick=()=>$('#import-file').click();$('#import-file').onchange=async event=>{try{const obj=JSON.parse(await event.target.files[0].text());if(obj.run_id!==R.run_id||obj.schema_version!==1||!obj.records||typeof obj.records!=='object')throw Error('运行 ID 或格式不匹配');for(const [id,r] of Object.entries(obj.records)){if(!validIDs.has(id)||!Object.hasOwn(stateNames,r.status)||typeof (r.reason||'')!=='string')throw Error('存在未知字段或非法核对状态')}reviews=obj.records;save();render();$('#message').textContent='核对记录已导入'}catch(e){$('#message').textContent='导入失败：'+e.message}event.target.value=''};
$('#run').textContent=R.case.case_id+' · '+R.run_id;$('#footer').textContent=R.limitations.join(' ');$('#views').innerHTML=[...arms.map(a=>[a,names[a]]),['compare','字段对照'],['coverage','来源覆盖'],['evaluation','效果核对'],['run','运行记录']].map(([id,name])=>`<button data-view="${id}">${name}</button>`).join('');metrics();render();
</script></body></html>
