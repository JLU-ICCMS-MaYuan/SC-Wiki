<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="735" viewBox="0 0 1160 735" role="img" aria-labelledby="title desc">
  <title id="title">补充字段身份与原文归属：当前流程和拟议修复</title>
  <desc id="desc">左侧为当前问题，右侧为未实施的方案。P1 是补内部编号导致值被误认成新增；P2 是扩展对象过滤遗漏叶子原文。灰色表示正常步骤，红色表示问题，蓝色表示拟议修复。两侧均从同一 q 网格值和带字段地址的引句开始。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #374151; text-anchor: middle; font-size: 18px; }
      .heading { font-size: 24px; font-weight: 600; }
      .small { font-size: 16px; }
      .normal { fill: #F3F4F6; stroke: #6B7280; stroke-width: 1.5; }
      .problem { fill: #FEE2E2; stroke: #B91C1C; stroke-width: 2; }
      .fix { fill: #DBEAFE; stroke: #1D4ED8; stroke-width: 2; }
      .red { fill: #991B1B; } .blue { fill: #1E40AF; }
      .edge { fill: none; stroke: #6B7280; stroke-width: 2; marker-end: url(#grayArrow); }
      .badEdge { fill: none; stroke: #B91C1C; stroke-width: 2; marker-end: url(#redArrow); }
      .fixEdge { fill: none; stroke: #1D4ED8; stroke-width: 2; marker-end: url(#blueArrow); }
    </style>
    <marker id="grayArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#6B7280"/></marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#B91C1C"/></marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#1D4ED8"/></marker>
  </defs>
  <rect width="1160" height="735" fill="#FFFFFF"/>
  <text x="580" y="35" class="heading">同一 q 网格：保存与子项核对</text>
  <rect x="20" y="60" width="548" height="604" rx="12" fill="#FFFFFF" stroke="#6B7280"/>
  <rect x="592" y="60" width="548" height="604" rx="12" fill="#FFFFFF" stroke="#6B7280"/>
  <text x="294" y="99" class="heading">修改前（当前存在问题）</text>
  <text x="866" y="99" class="heading">修改后（拟议方案）</text>

  <rect x="61" y="124" width="466" height="62" rx="25" class="normal"/>
  <text x="294" y="150">值仍为 12×12×12</text><text x="294" y="175" class="small">已有标到“值”的 SI 引句</text>
  <rect x="633" y="124" width="466" height="62" rx="25" class="normal"/>
  <text x="866" y="150">值仍为 12×12×12</text><text x="866" y="175" class="small">已有标到“值”的 SI 引句</text>

  <path d="M294 186V216" class="edge"/><path d="M866 186V216" class="edge"/>
  <rect x="61" y="218" width="466" height="76" rx="8" class="problem"/>
  <text x="294" y="249" class="red">问题 P1：补号后更换审核身份</text>
  <text x="294" y="277" class="red small">旧字段删除，新字段起点为空</text>
  <rect x="633" y="218" width="466" height="76" rx="8" class="fix"/>
  <text x="866" y="249" class="blue">修复 P1：补号保持身份与原基线</text>
  <text x="866" y="277" class="blue small">只比较本子项实际变化</text>

  <path d="M294 294V325" class="edge"/><path d="M866 294V325" class="edge"/>
  <rect x="61" y="327" width="466" height="62" rx="8" class="problem"/>
  <text x="294" y="353" class="red">问题 P2：只按扩展对象筛原文</text>
  <text x="294" y="378" class="red small">漏掉已标明“值”地址的引句</text>
  <rect x="633" y="327" width="466" height="62" rx="8" class="fix"/>
  <text x="866" y="353" class="blue">修复 P2：按叶子地址核验并归位</text>
  <text x="866" y="378" class="blue small">不复制整条旧记录的通过结论</text>

  <path d="M294 389V423" class="edge"/><path d="M866 389V423" class="edge"/>
  <rect x="61" y="425" width="466" height="76" rx="8" class="problem"/>
  <text x="294" y="456" class="red">问题 P1：误判“空→当前值”</text>
  <text x="294" y="484" class="red small">要求修改理由与模型核对</text>
  <rect x="633" y="425" width="466" height="76" rx="8" class="normal"/>
  <text x="866" y="456">沿用既有未修改字段规则</text>
  <text x="866" y="484" class="small">可人工确认，无需修改理由</text>

  <path d="M294 501V536" class="edge"/><path d="M866 501V536" class="edge"/>
  <rect x="61" y="538" width="466" height="86" rx="25" class="problem"/>
  <text x="294" y="569" class="red">问题 P2：子项无原文</text>
  <text x="294" y="599" class="red small">引句只剩在“旧整条记录原文”</text>
  <rect x="633" y="538" width="466" height="86" rx="25" class="fix"/>
  <text x="866" y="569" class="blue">修复 P2：显示本子项的有效原文</text>
  <text x="866" y="599" class="blue small">无归属引句另作参考</text>

  <rect x="188" y="687" width="18" height="18" class="normal"/><text x="277" y="703" class="small">正常／保留</text>
  <rect x="443" y="687" width="18" height="18" class="problem"/><text x="533" y="703" class="small">当前问题</text>
  <rect x="702" y="687" width="18" height="18" class="fix"/><text x="816" y="703" class="small">拟议修复，尚未实施</text>
</svg>
