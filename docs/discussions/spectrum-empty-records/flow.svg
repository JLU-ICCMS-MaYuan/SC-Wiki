<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
  <title id="title">谱空记录：当前失败路径与拟议修复</title>
  <desc id="desc">左侧为当前失败路径，右侧为尚未实施的修复方案。灰色为正常步骤，红色为问题，蓝色为对应修复。没有跨版本执行箭头。</desc>
  <defs>
    <marker id="gray" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#6B7280"/></marker>
    <marker id="red" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#B91C1C"/></marker>
    <marker id="blue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#1D4ED8"/></marker>
    <style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:17px;text-anchor:middle}.normal{fill:#F3F4F6;stroke:#6B7280;stroke-width:1.5}.problem{fill:#FEE2E2;stroke:#B91C1C;stroke-width:2}.fix{fill:#DBEAFE;stroke:#1D4ED8;stroke-width:2}.nt{fill:#374151}.pt{fill:#991B1B}.ft{fill:#1E40AF}.edge{fill:none;stroke-width:2}</style>
  </defs>
  <rect width="1120" height="760" fill="white"/>
  <text x="560" y="30" class="nt" style="font-size:22px;font-weight:600">同一场景：读图检查未通过，保留失败来源</text>
  <rect x="25" y="55" width="520" height="640" rx="12" fill="white" stroke="#6B7280"/>
  <rect x="575" y="55" width="520" height="640" rx="12" fill="white" stroke="#6B7280"/>
  <text x="285" y="87" class="nt" style="font-weight:600">修改前（当前失败路径）</text>
  <text x="835" y="87" class="nt" style="font-weight:600">修改后（拟议方案，尚未实施）</text>
  <g class="edge" stroke="#6B7280" marker-end="url(#gray)"><path d="M285 159 V184"/><path d="M285 319 V344"/><path d="M835 159 V184"/><path d="M835 319 V344"/></g>
  <g class="edge" stroke="#B91C1C" marker-end="url(#red)"><path d="M285 239 V264"/><path d="M285 399 V424"/><path d="M285 479 V504"/><path d="M285 559 V584"/></g>
  <g class="edge" stroke="#1D4ED8" marker-end="url(#blue)"><path d="M835 239 V264"/><path d="M835 399 V424"/><path d="M835 479 V504"/><path d="M835 559 V584"/></g>
  <rect x="75" y="109" width="420" height="50" rx="25" class="normal"/><text x="285" y="140" class="nt">原 PDF 与布局图块</text>
  <rect x="75" y="184" width="420" height="55" rx="8" class="problem"/><text x="285" y="217" class="pt">问题 P2：读图失败只留统一提示</text>
  <rect x="75" y="264" width="420" height="55" rx="8" class="problem"/><text x="285" y="297" class="pt">问题 P1：普通图块进入谱候选</text>
  <rect x="75" y="344" width="420" height="55" rx="8" class="normal"/><text x="285" y="377" class="nt">保留原图与无曲线、无归属记录</text>
  <rect x="75" y="424" width="420" height="55" rx="8" class="problem"/><text x="285" y="457" class="pt">问题 P3：空归属也提示条件变化</text>
  <rect x="75" y="504" width="420" height="55" rx="8" class="problem"/><text x="285" y="537" class="pt">问题 P4：默认叠加隐藏无标定原图</text>
  <rect x="75" y="584" width="420" height="50" rx="25" class="normal"/><text x="285" y="615" class="nt">详情看起来为空，无法判断来源</text>
  <rect x="625" y="109" width="420" height="50" rx="25" class="normal"/><text x="835" y="140" class="nt">原 PDF 与布局图块</text>
  <rect x="625" y="184" width="420" height="55" rx="8" class="fix"/><text x="835" y="217" class="ft">修复 P2：保留具体读图失败原因</text>
  <rect x="625" y="264" width="420" height="55" rx="8" class="fix"/><text x="835" y="297" class="ft">修复 P1：筛查类型，排除非目标图</text>
  <rect x="625" y="344" width="420" height="55" rx="8" class="normal"/><text x="835" y="377" class="nt">保留原图与无曲线、无归属记录</text>
  <rect x="625" y="424" width="420" height="55" rx="8" class="fix"/><text x="835" y="457" class="ft">修复 P3：区分从未归属与条件过期</text>
  <rect x="625" y="504" width="420" height="55" rx="8" class="fix"/><text x="835" y="537" class="ft">修复 P4：无标定时默认显示原图</text>
  <rect x="625" y="584" width="420" height="50" rx="25" class="normal"/><text x="835" y="615" class="nt">可以查看来源和具体失败原因</text>
  <text x="285" y="670" class="nt" style="font-size:14px">失败记录不等于已提取的科学谱</text>
  <text x="835" y="670" class="nt" style="font-size:14px">提取成功后再核对材料归属与科学采纳</text>
  <rect x="230" y="717" width="20" height="20" class="normal"/><text x="315" y="733" class="nt">正常／保留</text>
  <rect x="470" y="717" width="20" height="20" class="problem"/><text x="555" y="733" class="pt">问题 P1–P4</text>
  <rect x="710" y="717" width="20" height="20" class="fix"/><text x="815" y="733" class="ft">对应修复 P1–P4</text>
</svg>
