<div id="unified-properties-demo" class="viz-dotted-background">

    </section>
  </section>
</div>
<script>
(() => {
  const root = document.getElementById('unified-properties-demo');

    dynamical: { title: '最高声子频率 · 自定义性质', values: { name: 'maximum phonon frequency', kind: 'number', raw: '12.4', number: '12.4', unit: 'THz', first: '', second: '', text: '', boolean: false, code: 'Quantum ESPRESSO', method: 'DFT', functional: 'PBE', kGrid: '12 × 12 × 12', qGrid: '4 × 4 × 4', kWidth: '', qWidth: '' }, conditions: [['code','计算软件',150],['method','电子结构方法',120],['functional','交换关联泛函',125],['kGrid','k 网格',140],['qGrid','q 网格',130],['kWidth','k 展宽',110],['qWidth','q 展宽',110]] },
    thermodynamic: { title: '相对于分解路径的热力学稳定性', values: { hullBasis: 'formation_enthalpy', stability: 'unstable', energyAboveHull: '0.025', decomposition: '', gibbsTemperature: '', zpe: 'unreported', pressure: '', code: '', functional: '', kGrid: '' }, conditions: [['gibbsTemperature','温度 (K)',115],['pressure','压力 (GPa)',125],['zpe','零点振动能 ZPE',180],['code','计算软件',150],['functional','交换关联泛函',125],['kGrid','k 网格',140]] },
    superconductive: { title: '预测 Tc · allen_dynes', values: { name: 'critical temperature', kind: 'range', first: '281', second: '311', firstMu: '0.13', secondMu: '0.10', number: '300', mu: '0.10', lambda: '', omega: '', representative: false, code: 'Quantum ESPRESSO', method: 'DFT', functional: 'PBE', kGrid: '24 × 24 × 24', qGrid: '6 × 6 × 6', kWidth: '', qWidth: '' }, conditions: [['code','计算软件',150],['method','电子结构方法',120],['functional','交换关联泛函',125],['kGrid','k 网格',140],['qGrid','q 网格',130],['kWidth','k 展宽',110],['qWidth','q 展宽',110]] },
  };
  const modules = Object.keys(definitions);
  const records = Object.fromEntries(modules.map(key => [key, { values: structuredClone(definitions[key].values), parameters: [], conditions: [] }]));
  records.thermodynamic.hullDrafts = {};
  const hullBases = ['unreported','formation_energy','formation_enthalpy','gibbs_free_energy'];
  const hullFields = ['stability','energyAboveHull','decomposition','gibbsTemperature','zpe','pressure','code','functional','kGrid'];
  const changeHullBasis = basis => {
    const record=records.thermodynamic, current=record.values;

  };
  let selected = 'dynamical', page = 'modules';
  const spectrumExamples = {
    phonon_dos: { title: '声子态密度解析结果', detail: '声子态密度解析详情', module: 'dynamical', source: '示例文献.pdf · 第 4 页 · 图 2(a)', axis: 'DOS / 相对幅值',
      points: [[0,0,'observed'],[2,0.18,'observed'],[4,0.48,'observed'],[6,0.34,'observed'],[8,0.72,'interpolated'],[10,1.02,'observed'],[12,0.42,'observed'],[14,0.64,'observed'],[16,0.21,'observed'],[18,0,'observed']] },
    alpha2f: { title: 'Eliashberg 谱函数 α²F(ω) 解析结果', detail: 'Eliashberg 谱函数解析详情', module: 'superconductive', source: '示例文献.pdf · 第 5 页 · 图 3(b)', axis: 'α²F(ω) / 无量纲',
      points: [[0,0,'observed'],[2,0.08,'observed'],[4,0.28,'observed'],[6,0.16,'observed'],[8,0.53,'observed'],[10,0.78,'observed'],[12,0.36,'interpolated'],[14,0.44,'observed'],[16,0.14,'observed'],[18,0,'observed']] },

  const field = (module, key, label, { width = 110, options, unit, item, group } = {}) => {
    const wrap = element('label','up-field'); wrap.style.width = `${width}px`;
    wrap.append(element('span','up-label',label));
    const input = element(options ? 'select' : 'input');
    if (options) for (const [value, title] of options) { const option = element('option',null,title); option.value = value; input.append(option); }
    const value = item ? item[key] : records[module].values[key]; input.value = value == null ? '' : String(value);
    input.setAttribute('aria-label',label); input.dataset.module = module;
    if (item) { input.dataset.item = item.id; input.dataset.group = group; input.dataset.extraKey = key; } else input.dataset.key = key;

  };
  const check = (module, key, label) => {
    const wrap = element('label','up-check cursor-interaction'), input = element('input'); input.type = 'checkbox'; input.checked = Boolean(records[module].values[key]); input.dataset.module = module; input.dataset.key = key;
    wrap.append(input,document.createTextNode(label)); return wrap;
  };
  const mainRow = module => {
    const state = records[module].values, host = root.querySelector(`[data-panel="${module}"] [data-main]`); host.replaceChildren();
    if (module === 'thermodynamic') {
      host.append(field(module,'hullBasis','凸包计算依据',{width:300,options:[['unreported','论文未说明'],['formation_energy','形成能 ΔE（0 K）'],['formation_enthalpy','形成焓 ΔH（0 K）'],['gibbs_free_energy','形成吉布斯自由能 ΔG（含温度）']]}));
      host.append(field(module,'stability','相对于分解路径的稳定性',{width:210,options:[['unknown','未判定'],['stable','稳定'],['unstable','不稳定']]}));
      const hullLabel = state.hullBasis === 'formation_enthalpy' ? 'above hull（ΔH）' : state.hullBasis === 'gibbs_free_energy' ? 'above hull（ΔG）' : state.hullBasis === 'formation_energy' ? 'energy above hull' : 'above hull';
      if (state.stability === 'unstable') host.append(field(module,'energyAboveHull',hullLabel,{width:215,unit:'eV/atom'}));
      host.append(field(module,'decomposition','分解路径',{width:300}));
      return;
    }
    const tc = module === 'superconductive';
    if (tc) host.append(field(module,'lambda','电声耦合强度 λ',{width:130}),field(module,'omega','ωlog',{unit:'K'}));
    host.append(field(module,'name','名称',{width:tc ? 190 : 220}),field(module,'kind','值类型',{width:90,options:tc ? kindOptions.slice(0,2) : kindOptions}));
    if (!tc) host.append(field(module,'raw','原始值'));
    if (tc) {
      for (let i = 0; i < (state.kind === 'range' ? 2 : 1); i++) {
        const pair = element('div','up-pair'); pair.setAttribute('role','group'); pair.setAttribute('aria-label',i ? '第二组 Tc 与 μ*' : '第一组 Tc 与 μ*');
        pair.append(field(module,state.kind === 'range' ? i ? 'second' : 'first' : 'number','Tc',{unit:'K'}),field(module,state.kind === 'range' ? i ? 'secondMu' : 'firstMu' : 'mu','μ*')); host.append(pair);
      }
      host.append(check(module,'representative','代表结果'));
    } else {
      if (state.kind === 'number') host.append(field(module,'number','数值'));
      if (state.kind === 'range') host.append(field(module,'first','下界'),field(module,'second','上界'));
      if (state.kind === 'text') host.append(field(module,'text','文本值',{width:180}));

      host.append(field(module,'unit','单位'));

  };
  const addButton = (module, group) => {
    const button = element('button','up-button cursor-interaction','＋ 新增字段'); button.type = 'button'; button.dataset.add = group; button.dataset.module = module;

  };
  const conditionsRow = module => {
    const host = root.querySelector(`[data-panel="${module}"] [data-fixed-conditions]`); host.replaceChildren();
    for (const [key,label,width] of definitions[module].conditions) {
      const options = key === 'zpe' ? [['unreported','论文未说明'],['included','已计入'],['excluded','明确未计入']] : undefined;
      const control = field(module,key,label,{width,options});
      if (key === 'gibbsTemperature' && ['formation_energy','formation_enthalpy'].includes(records[module].values.hullBasis)) { const input=control.querySelector('input'); input.value='0'; input.disabled=true; }

  };
  const measurement = document.createElement('canvas').getContext('2d');

      }

        const kind = module === 'dynamical' ? 'phonon_dos' : 'alpha2f', spectrum = spectrumExamples[kind];

  const show = () => {
    root.querySelector('[data-form-page]').hidden = page !== 'modules';
    root.querySelector('[data-detail-page]').hidden = page === 'modules';

  const svgNode = (tag, attributes, text) => { const node = document.createElementNS('http://www.w3.org/2000/svg',tag); for (const [key,value] of Object.entries(attributes)) node.setAttribute(key,String(value)); if (text != null) node.textContent = text; return node; };

    const x = value => left+value/18*(right-left), y = value => bottom-value/max*(bottom-top);
    const svg = svgNode('svg',{viewBox:`0 0 ${width} ${height}`,role:'img','aria-label':`${data.detail}示例曲线`});
    svg.append(svgNode('rect',{x:left,y:top,width:right-left,height:bottom-top,fill:'none',stroke:'var(--up-border)'}));
    for (const value of [0,6,12,18]) { svg.append(svgNode('text',{x:x(value),y:bottom+20,'text-anchor':'middle'},String(value))); }
    for (let i=0;i<3;i++) { const value=max*i/2; svg.append(svgNode('text',{x:left-10,y:y(value)+4,'text-anchor':'end'},value.toFixed(2))); }
    svg.append(svgNode('text',{x:left,y:16},data.axis),svgNode('text',{x:(left+right)/2,y:252,'text-anchor':'middle'},'频率 / THz'));
    svg.append(svgNode('path',{d:data.points.map((point,index)=>`${index?'L':'M'}${x(point[0])},${y(point[1])}`).join(' '),fill:'none',stroke:'var(--up-primary)','stroke-width':2}));
    for (const point of data.points) svg.append(svgNode('circle',{cx:x(point[0]),cy:y(point[1]),r:3.5,fill:point[2]==='observed'?'var(--up-primary)':'var(--up-bg)',stroke:'var(--up-primary)'}));
    host.replaceChildren(svg);
  };
  const renderDetail = () => {
    const data = spectrumExamples[page], back = root.querySelector('[data-detail-back]');
    back.href = `#properties/${data.module}`; back.textContent = `← 返回${data.module === 'dynamical'?'动力学性质':'超导性质'}`;
    root.querySelector('[data-detail-title]').textContent = data.detail;
    const summary = root.querySelector('[data-detail-summary]'); summary.replaceChildren();
    for (const [label,value] of [['材料状态','当前材料状态 · 示例'],['来源',data.source],['解析状态','提取完成 · 待核对'],['有效频域','0–18 THz']]) { const entry=element('div'); entry.append(element('span','up-detail-label',label),element('span',null,value)); summary.append(entry); }
    const body=root.querySelector('[data-detail-points]'); body.replaceChildren();
    for (const point of data.points) { const row=element('tr'); for(const value of [point[0].toFixed(2),point[2]==='observed'?point[1].toFixed(3):'—',point[1].toFixed(3),point[2]==='observed'?'原图观测':'短缺口插值']) row.append(element('td',null,value)); body.append(row); }
    drawChart();
  };
  const snapshot = () => ({ selected, page, records });
  const save = () => { if (window.openai && window.openai.setWidgetState && JSON.stringify(snapshot()).length < 14000) window.openai.setWidgetState({modelContent:{unifiedProperties:snapshot()},privateContent:null}).catch(() => {}); };
  const restore = data => {
    if (!data || typeof data !== 'object') return;
    if (modules.includes(data.selected)) selected = data.selected;
    if (data.page === 'modules' || spectrumExamples[data.page]) page = data.page;
    for (const module of modules) {
      const saved = data.records && data.records[module]; if (!saved) continue;
      const compatible = module !== 'thermodynamic' || typeof saved.values?.hullBasis === 'string';
      for (const key of Object.keys(records[module].values)) if (compatible && saved.values && typeof saved.values[key] === typeof records[module].values[key]) records[module].values[key] = saved.values[key];
      if (module === 'thermodynamic' && saved.hullDrafts) for (const basis of hullBases) {
        const draft=saved.hullDrafts[basis];
        if (draft && hullFields.every(key=>typeof draft[key]==='string')) records[module].hullDrafts[basis]=Object.fromEntries(hullFields.map(key=>[key,draft[key]]));
      }
      if (module !== 'thermodynamic' && !(module === 'superconductive' ? ['number','range'] : kindOptions.map(option => option[0])).includes(records[module].values.kind)) records[module].values.kind = definitions[module].values.kind;
      for (const group of ['parameters','conditions']) if (Array.isArray(saved[group])) records[module][group] = saved[group].map(item => ({id:String(item.id),name:String(item.name || ''),kind:item.kind === 'text' ? 'text' : 'number',value:String(item.value || ''),unit:String(item.unit || '')}));
    }
  };
  root.addEventListener('input', event => {
    const input = event.target, module = input.dataset.module; if (!modules.includes(module)) return;
    if (input.dataset.extraKey) { const item = records[module][input.dataset.group].find(item => item.id === input.dataset.item); if (item) item[input.dataset.extraKey] = input.value; fit(input); }
    else if (input.dataset.key) { if (input.dataset.key === 'hullBasis') changeHullBasis(input.value); else records[module].values[input.dataset.key] = input.type === 'checkbox' ? input.checked : input.value; if (['kind','stability','hullBasis'].includes(input.dataset.key)) mainRow(module); if (input.dataset.key === 'hullBasis') conditionsRow(module); }
    save();
  });
  root.addEventListener('click', event => {
    const spectrum = event.target.closest('[data-spectrum]'); if (spectrum) { event.preventDefault(); page=spectrum.dataset.spectrum; selected=spectrumExamples[page].module; show(); save(); return; }
    const back = event.target.closest('[data-detail-back]'); if (back) { event.preventDefault(); page='modules'; show(); save(); return; }
    const tab = event.target.closest('[role="tab"]'); if (tab) { selected = tab.dataset.module; page='modules'; show(); save(); return; }
    const add = event.target.closest('[data-add]'); if (add) { const module = add.dataset.module, group = add.dataset.add; records[module][group].push({id:`${Date.now()}-${Math.random().toString(36).slice(2)}`,name:'',kind:'number',value:'',unit:''}); extras(module,group); root.querySelector(`[data-panel="${module}"] [data-extras="${group}"]`).lastElementChild.querySelector('input').focus(); save(); return; }
    const remove = event.target.closest('[data-remove]'); if (remove) { const module = remove.dataset.module, group = remove.dataset.group; records[module][group] = records[module][group].filter(item => item.id !== remove.dataset.remove); extras(module,group); save(); }
  });
  root.querySelector('[role="tablist"]').addEventListener('keydown', event => {
    if (!['ArrowLeft','ArrowRight','Home','End'].includes(event.key)) return;
    event.preventDefault(); const index = modules.indexOf(selected); selected = event.key === 'Home' ? modules[0] : event.key === 'End' ? modules.at(-1) : modules[(index+(event.key === 'ArrowRight' ? 1 : modules.length-1))%modules.length]; show(); root.querySelector(`[role="tab"][data-module="${selected}"]`).focus(); save();
  });
  restore(window.openai && window.openai.widgetState && window.openai.widgetState.modelContent && window.openai.widgetState.modelContent.unifiedProperties); build(); show();
  new ResizeObserver(drawChart).observe(root.querySelector('[data-detail-chart]'));
  window.addEventListener('openai:set_globals', event => { const saved = event.detail && event.detail.globals && event.detail.globals.widgetState; const data = saved && saved.modelContent && saved.modelContent.unifiedProperties; if (data && JSON.stringify(data) !== JSON.stringify(snapshot())) { restore(data); build(); show(); } });
})();
</script>
