<style>
  #unified-properties-demo { color-scheme: light dark; padding: 16px 0; }
  #unified-properties-demo .up-product { --up-bg: light-dark(#fff, #202124); --up-fg: light-dark(#253043, #e4e7ee); --up-muted: light-dark(#657187, #b3bac8); --up-border: light-dark(#c7ccd5, #626977); --up-primary: light-dark(#6554e8, #b6aaff); --up-soft: light-dark(#f4f3ff, #302c43); --up-error: light-dark(#ad2537, #ff9da8); background: var(--up-bg); color: var(--up-fg); border: 1px solid var(--up-border); border-radius: 8px; padding: 18px 16px; font: 14px/1.5 Roboto, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; box-sizing: border-box; position: relative; }

  #unified-properties-demo .up-label { position: absolute; top: -9px; left: 9px; padding: 0 4px; background: var(--up-field-bg, var(--up-bg)); color: var(--up-primary); font-size: 12px; white-space: nowrap; }
  #unified-properties-demo input:not([type=checkbox]), #unified-properties-demo select { display: block; box-sizing: border-box; width: 100%; min-width: 0; height: 44px; padding: 9px 11px; border: 1px solid var(--up-border); border-radius: 6px; background: var(--up-field-bg, var(--up-bg)); color: var(--up-fg); font: inherit; }
  #unified-properties-demo input:focus, #unified-properties-demo select:focus { border-color: var(--up-primary); }
  #unified-properties-demo input.up-with-unit { padding-right: 28px; }
  #unified-properties-demo .up-unit { position: absolute; right: 11px; top: 11px; color: var(--up-muted); pointer-events: none; }
  #unified-properties-demo .up-pair { --up-field-bg: var(--up-soft); display: flex; gap: 8px; align-items: center; padding: 14px 8px; border-radius: 8px; background: var(--up-soft); flex: 0 0 auto; }
  #unified-properties-demo .up-check { display: flex; align-items: center; gap: 6px; white-space: nowrap; min-height: 44px; }
  #unified-properties-demo input[type=checkbox] { width: 18px; height: 18px; margin: 0; accent-color: var(--up-primary); }
  #unified-properties-demo .up-extension { display: flex; flex-wrap: nowrap; gap: 10px; align-items: center; width: max-content; padding: 10px 1px; }
  #unified-properties-demo .up-button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 6px 10px; border: none; border-radius: 4px; background: transparent; color: var(--up-primary); font: inherit; font-weight: 500; white-space: nowrap; }
  #unified-properties-demo .up-button:hover { background: var(--up-soft); }
  #unified-properties-demo .up-remove { border: none; background: transparent; color: var(--up-muted); min-height: 40px; padding: 8px 6px; font: inherit; }
  #unified-properties-demo .up-remove:hover { color: var(--up-error); }
  #unified-properties-demo .up-parameters { margin-bottom: 18px; }
  #unified-properties-demo .up-conditions-title { margin: 0 0 10px; font-weight: 500; }
  #unified-properties-demo .up-spectra { margin: 22px 0 2px; }
  #unified-properties-demo .up-spectra-title { font-weight: 500; margin-bottom: 8px; }
  #unified-properties-demo .up-spectrum-link { width: 100%; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px 20px; box-sizing: border-box; padding: 14px 16px; border: none; border-radius: 6px; background: var(--up-soft); color: var(--up-fg); text-decoration: none; }
  #unified-properties-demo .up-spectrum-name { font-weight: 500; }
  #unified-properties-demo .up-spectrum-meta { display: block; color: var(--up-muted); font-size: 12px; margin-top: 4px; }
  #unified-properties-demo .up-open-detail { color: var(--up-primary); white-space: nowrap; }
  #unified-properties-demo .up-back { display: inline-block; color: var(--up-primary); text-decoration: none; margin-bottom: 14px; }
  #unified-properties-demo .up-detail-title { margin: 0 0 8px; font: inherit; font-weight: 500; }
  #unified-properties-demo .up-detail-source { color: var(--up-muted); font-size: 12px; margin-bottom: 14px; }
  #unified-properties-demo .up-detail-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; margin: 14px 0; }
  #unified-properties-demo .up-detail-label { color: var(--up-muted); display: block; font-size: 12px; }
  #unified-properties-demo .up-chart { min-width: 0; }
  #unified-properties-demo .up-chart svg { display: block; width: 100%; }
  #unified-properties-demo .up-chart text { fill: var(--up-fg); font: 12px Arial, 'PingFang SC', sans-serif; }
  #unified-properties-demo .up-point-table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
  #unified-properties-demo .up-point-table th, #unified-properties-demo .up-point-table td { text-align: left; padding: 9px 6px; border-bottom: 1px solid var(--up-border); font-weight: 400; }
  #unified-properties-demo .up-point-table th { color: var(--up-muted); }
  #unified-properties-demo .up-point-heading { margin: 12px 0 4px; font-weight: 500; }
  #unified-properties-demo .up-state-summary { padding: 8px 0 16px; font-weight: 500; }
  #unified-properties-demo .up-state-caption { display: inline; margin-left: 12px; color: var(--up-muted); overflow-wrap: anywhere; font-weight: 400; }
  #unified-properties-demo .up-state-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 2px 0 16px; }
  #unified-properties-demo .up-record-notice { font-size: 12px; color: var(--up-muted); }
  #unified-properties-demo .up-product.up-review-open { min-height: 780px; }
  #unified-properties-demo .up-review-overlay { position: absolute; inset: 0; z-index: 10; display: flex; justify-content: flex-end; background: light-dark(rgba(30,35,50,.2),rgba(0,0,0,.45)); border-radius: 8px; }
  #unified-properties-demo .up-review { width: min(430px,100%); padding: 20px; box-sizing: border-box; background: var(--up-bg); color: var(--up-fg); border-radius: 0 8px 8px 0; }
  #unified-properties-demo .up-review-heading { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; font-weight: 500; }
  #unified-properties-demo .up-review-note { background: var(--up-soft); border-radius: 6px; padding: 12px; margin-bottom: 14px; font-size: 12px; }
  #unified-properties-demo .up-review-label { display: block; margin-bottom: 12px; }
  #unified-properties-demo .up-review-label > span { display: block; margin-bottom: 7px; }
  #unified-properties-demo .up-review textarea { width: 100%; min-height: 90px; resize: vertical; box-sizing: border-box; padding: 10px 11px; border: 1px solid var(--up-border); border-radius: 6px; background: var(--up-bg); color: var(--up-fg); font: inherit; }
  #unified-properties-demo .up-review-choice { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
  #unified-properties-demo .up-review-choice label { display: flex; align-items: center; gap: 6px; min-height: 32px; }
  #unified-properties-demo .up-review-choice input[type=radio] { width: 18px; height: 18px; padding: 0; margin: 0; accent-color: var(--up-primary); }
  #unified-properties-demo .up-review-file { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 4px 12px; padding: 8px 0; }
  #unified-properties-demo .up-review-file small { display: block; color: var(--up-muted); font-size: 12px; }
  #unified-properties-demo .up-review-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  #unified-properties-demo .up-primary { border: none; border-radius: 6px; background: var(--up-primary); color: light-dark(#fff,#202124); padding: 9px 16px; min-height: 42px; font: inherit; }
  #unified-properties-demo .up-primary:disabled { background: var(--up-border); color: var(--up-muted); }
  #unified-properties-demo .up-completion-reasons { margin: 10px 0; font-size: 12px; }
  #unified-properties-demo .up-completion-reasons ul { margin: 6px 0 0; padding-left: 18px; }
  @media (max-width: 460px) { #unified-properties-demo .up-detail-grid { grid-template-columns: 1fr; } }
  #unified-properties-demo [hidden] { display: none !important; }
  @media (pointer: coarse) { #unified-properties-demo input:not([type=checkbox]), #unified-properties-demo select { font-size: 16px; } #unified-properties-demo button { min-height: 44px; } }
</style>
<div id="unified-properties-demo" class="viz-dotted-background">
  <section class="up-product" aria-label="四类物性统一表单设计">
    <div data-form-page>
    <div class="up-header">材料状态与性质 <span class="up-example">示例数据 · 理论计算记录</span></div>
    <details class="up-state" data-material-card open>
      <summary class="up-state-summary cursor-interaction">材料状态 #1 <span class="up-state-caption" data-material-caption>P6/mmm · LaSc₂H₂₄ · 150 GPa</span></summary>
      <div class="up-scroll"><div class="up-line" data-material-inputs></div></div>
      <div class="up-state-actions"><button type="button" class="up-button cursor-interaction" data-open-review>来源核对 / 人工修改</button><span class="up-record-notice" data-review-notice>当前字段的人工修改待处理</span></div>
    <div class="up-tabs" role="tablist" aria-label="物性模块">
      <button type="button" class="cursor-interaction" id="up-tab-electronic" role="tab" aria-selected="true" aria-controls="up-panel-electronic" data-module="electronic">电子性质</button>
      <button type="button" class="cursor-interaction" id="up-tab-dynamical" role="tab" aria-selected="false" aria-controls="up-panel-dynamical" data-module="dynamical">动力学性质</button>
      <button type="button" class="cursor-interaction" id="up-tab-thermodynamic" role="tab" aria-selected="false" aria-controls="up-panel-thermodynamic" data-module="thermodynamic">热力学性质</button>
      <button type="button" class="cursor-interaction" id="up-tab-superconductive" role="tab" aria-selected="false" aria-controls="up-panel-superconductive" data-module="superconductive">超导性质</button>
    </div>
    <section id="up-panel-electronic" role="tabpanel" aria-labelledby="up-tab-electronic" data-panel="electronic"></section>
    <section id="up-panel-dynamical" role="tabpanel" aria-labelledby="up-tab-dynamical" data-panel="dynamical" hidden></section>
    <section id="up-panel-thermodynamic" role="tabpanel" aria-labelledby="up-tab-thermodynamic" data-panel="thermodynamic" hidden></section>
    <section id="up-panel-superconductive" role="tabpanel" aria-labelledby="up-tab-superconductive" data-panel="superconductive" hidden></section>
    </details>
    </div>
    <section data-detail-page hidden aria-label="谱解析详情页">
      <a class="up-back cursor-interaction" data-detail-back href="#properties/dynamical">← 返回动力学性质</a>
      <h2 class="up-detail-title" data-detail-title>声子态密度解析详情</h2>
      <div class="up-detail-source">布局示例数据 · 非实际论文解析结果</div>
      <div class="up-detail-grid" data-detail-summary></div>
      <div class="up-chart" data-detail-chart></div>
      <div class="up-detail-source">实心点：原图观测 · 空心点：短缺口插值</div>
      <div class="up-point-heading">逐点数据</div>
      <table class="up-point-table" aria-label="谱逐点解析数据"><thead><tr><th>频率 (THz)</th><th>原图幅值</th><th>重建幅值</th><th>点来源</th></tr></thead><tbody data-detail-points></tbody></table>
    </section>
    <div class="up-review-overlay" data-review-overlay hidden>
      <section class="up-review" role="dialog" aria-modal="true" aria-label="当前字段的人工修改记录">
        <div class="up-review-heading"><span>人工修改记录</span><button type="button" class="up-button cursor-interaction" data-close-review>返回编辑</button></div>
        <div class="up-record-notice" data-review-target></div>
        <div class="up-review-note">当前值或来源已修改，旧 AI 核对结果已失效。这里保存当前人工修改及依据，不把人工附件自动当作论文原文支持。</div>
        <label class="up-review-label"><span>人工修改说明（必填）</span><textarea data-review-input="reason" aria-label="人工修改说明（必填）" placeholder="说明修改依据或专业判断"></textarea></label>
        <div class="up-review-choice" role="radiogroup" aria-label="是否提供证据">
          <label class="cursor-interaction"><input type="radio" name="up-review-choice" value="provide" data-review-input="choice">提供证据</label>
          <label class="cursor-interaction"><input type="radio" name="up-review-choice" value="none" data-review-input="choice">不提供证据</label>
        </div>
        <label class="up-review-label" data-absence-field hidden><span>未提供证据的原因（必填）</span><textarea data-review-input="absence" aria-label="未提供证据的原因（必填）"></textarea></label>
        <div data-review-files></div>
        <div data-review-file-actions>
          <label class="up-button cursor-interaction">选择图片、文本或 PDF<input data-review-file type="file" accept=".png,.jpg,.jpeg,.webp,.txt,.md,.pdf" multiple hidden></label>
          <button type="button" class="up-button cursor-interaction" data-upload-review-files hidden>上传证据</button>
        </div>
        <div class="up-record-notice">附件在 Demo 中仅作本地交互演示。</div>
        <div class="up-completion-reasons" id="up-completion-reasons" aria-live="polite" data-completion-reasons></div>
        <div class="up-review-actions"><button type="button" class="up-primary cursor-interaction" data-complete-review aria-describedby="up-completion-reasons" disabled>保存并完成</button></div>
      </section>
    </div>
  </section>
</div>
<script>
(() => {
  const root = document.getElementById('unified-properties-demo');
  const material = { spaceGroup: 'P6/mmm', formula: 'LaSc2H24', pressure: '150' };
  const reviewDrafts = {};
  let reviewOpen = false, reviewModule = null;
  const definitions = {
    electronic: { title: '带隙 · 自定义性质', values: { name: 'band gap', kind: 'number', raw: '0.82', number: '0.82', unit: 'eV', first: '', second: '', text: '', boolean: false, code: 'VASP', method: 'DFT', functional: 'PBE', kGrid: '12 × 12 × 12', kWidth: '' }, conditions: [['code','计算软件',150],['method','电子结构方法',120],['functional','交换关联泛函',125],['kGrid','k 网格',140],['kWidth','k 展宽',110]] },
    dynamical: { title: '最高声子频率 · 自定义性质', values: { name: 'maximum phonon frequency', kind: 'number', raw: '12.4', number: '12.4', unit: 'THz', first: '', second: '', text: '', boolean: false, code: 'Quantum ESPRESSO', method: 'DFT', functional: 'PBE', kGrid: '12 × 12 × 12', qGrid: '4 × 4 × 4', kWidth: '', qWidth: '' }, conditions: [['code','计算软件',150],['method','电子结构方法',120],['functional','交换关联泛函',125],['kGrid','k 网格',140],['qGrid','q 网格',130],['kWidth','k 展宽',110],['qWidth','q 展宽',110]] },
    thermodynamic: { title: '相对于分解路径的热力学稳定性', values: { hullBasis: 'formation_enthalpy', stability: 'unstable', energyAboveHull: '0.025', decomposition: '', gibbsTemperature: '', zpe: 'unreported', pressure: '', code: '', functional: '', kGrid: '' }, conditions: [['gibbsTemperature','温度 (K)',115],['pressure','压力 (GPa)',125],['zpe','零点振动能 ZPE',180],['code','计算软件',150],['functional','交换关联泛函',125],['kGrid','k 网格',140]] },
    superconductive: { title: '预测 Tc · allen_dynes', values: { name: 'critical temperature', kind: 'range', first: '281', second: '311', firstMu: '0.13', secondMu: '0.10', number: '300', mu: '0.10', lambda: '', omega: '', representative: false, code: 'Quantum ESPRESSO', method: 'DFT', functional: 'PBE', kGrid: '24 × 24 × 24', qGrid: '6 × 6 × 6', kWidth: '', qWidth: '' }, conditions: [['code','计算软件',150],['method','电子结构方法',120],['functional','交换关联泛函',125],['kGrid','k 网格',140],['qGrid','q 网格',130],['kWidth','k 展宽',110],['qWidth','q 展宽',110]] },
  };
  const modules = Object.keys(definitions);
  const records = Object.fromEntries(modules.map(key => [key, { values: structuredClone(definitions[key].values), parameters: [], conditions: [] }]));
  records.thermodynamic.hullDrafts = {};
  const hullBases = ['unreported','formation_energy','formation_enthalpy','gibbs_free_energy'];
  const hullFields = ['stability','energyAboveHull','decomposition','gibbsTemperature','zpe','pressure','code','functional','kGrid'];
  const changeHullBasis = basis => {
    const record=records.thermodynamic, current=record.values;
    record.hullDrafts[current.hullBasis]=Object.fromEntries(hullFields.map(key=>[key,current[key]]));
    const next=record.hullDrafts[basis] || Object.fromEntries(hullFields.map(key=>[key,key==='stability'?'unknown':key==='zpe'?'unreported':'']));
    Object.assign(current,next,{hullBasis:basis});
  };
  let selected = 'dynamical', page = 'modules';
  const spectrumExamples = {
    phonon_dos: { title: '声子态密度解析结果', detail: '声子态密度解析详情', module: 'dynamical', source: '示例文献.pdf · 第 4 页 · 图 2(a)', axis: 'DOS / 相对幅值',
      points: [[0,0,'observed'],[2,0.18,'observed'],[4,0.48,'observed'],[6,0.34,'observed'],[8,0.72,'interpolated'],[10,1.02,'observed'],[12,0.42,'observed'],[14,0.64,'observed'],[16,0.21,'observed'],[18,0,'observed']] },
    alpha2f: { title: 'Eliashberg 谱函数 α²F(ω) 解析结果', detail: 'Eliashberg 谱函数解析详情', module: 'superconductive', source: '示例文献.pdf · 第 5 页 · 图 3(b)', axis: 'α²F(ω) / 无量纲',
      points: [[0,0,'observed'],[2,0.08,'observed'],[4,0.28,'observed'],[6,0.16,'observed'],[8,0.53,'observed'],[10,0.78,'observed'],[12,0.36,'interpolated'],[14,0.44,'observed'],[16,0.14,'observed'],[18,0,'observed']] },
  };
  const element = (tag, className, text) => { const node = document.createElement(tag); if (className) node.className = className; if (text != null) node.textContent = text; return node; };
  const materialCaption = () => {
    const formula=material.formula.replace(/[0-9]/g,digit=>'₀₁₂₃₄₅₆₇₈₉'[Number(digit)]);
    return `${material.spaceGroup.trim() || '空间群未填写'} · ${formula.trim() || '化学式未填写'} · ${material.pressure.trim() ? material.pressure.trim()+' GPa' : '压强未填写'}`;
  };
  const fingerprint = module => JSON.stringify({material,values:records[module].values,parameters:records[module].parameters,conditions:records[module].conditions});
  const reviewDraft = module => reviewDrafts[module] || (reviewDrafts[module]={reason:'',choice:'provide',absence:'',files:[{id:'example',name:'人工截图.png',status:'uploaded'}],doneFor:'',busy:false,uploading:false,message:''});
  const updateNotice = () => { root.querySelector('[data-review-notice]').textContent=reviewDraft(selected).doneFor===fingerprint(selected)?'当前字段的人工修改已保存（Demo）':'当前字段的人工修改待处理'; };
  const updateMaterialCaption = () => { root.querySelector('[data-material-caption]').textContent=materialCaption(); updateNotice(); };
  const buildMaterial = () => {
    const host=root.querySelector('[data-material-inputs]'); host.replaceChildren();
    for (const [key,label,width] of [['spaceGroup','空间群符号',150],['formula','化学式',190],['pressure','压强 (GPa)',145]]) {
      const wrap=element('label','up-field'); wrap.style.width=`${width}px`; wrap.append(element('span','up-label',label));
      const input=element('input'); input.value=material[key]; input.dataset.material=key; input.setAttribute('aria-label',label);
      wrap.append(input); host.append(wrap);
    }
    updateMaterialCaption();
  };
  const reviewBlockers = draft => {
    const reasons=[];
    if (!draft.reason.trim()) reasons.push('请填写人工修改说明');
    if (draft.choice==='provide' && !draft.files.length) reasons.push('请选择并上传证据，或选择“不提供证据”并说明原因');
    if (draft.choice==='provide' && draft.files.some(file=>file.status!=='uploaded')) reasons.push('还有证据未上传，请先点击“上传证据”');
    if (draft.choice==='none' && draft.files.length) reasons.push('请先移除已上传或待上传的证据');
    if (draft.choice==='none' && !draft.absence.trim()) reasons.push('请说明未提供证据的原因');
    return reasons;
  };
  const renderReview = () => {
    const overlay=root.querySelector('[data-review-overlay]'); overlay.hidden=!reviewOpen;
    const product=root.querySelector('.up-product'); product.classList.toggle('up-review-open',reviewOpen); product.style.minHeight='';
    root.querySelector('[data-form-page]').inert=reviewOpen;
    if (!reviewOpen) { updateNotice(); return; }
    const draft=reviewDraft(reviewModule), completed=draft.doneFor===fingerprint(reviewModule);
    root.querySelector('[data-review-target]').textContent=`${materialCaption()} · ${definitions[reviewModule].title}`;
    root.querySelectorAll('[data-review-input]').forEach(input=>{
      const key=input.dataset.reviewInput;
      if (input.type==='radio') input.checked=draft.choice===input.value;
      else if (input.value!==draft[key]) input.value=draft[key];
      input.disabled=draft.busy;
    });
    root.querySelector('[data-absence-field]').hidden=draft.choice!=='none';
    root.querySelector('[data-review-file-actions]').hidden=draft.choice!=='provide';
    root.querySelector('[data-review-file]').disabled=draft.busy || draft.uploading;
    const files=root.querySelector('[data-review-files]'); files.replaceChildren();
    for (const file of draft.files) {
