<style>
  #tc-single-row { color-scheme: light dark; padding: 16px 0; }
  #tc-single-row .tc-window { --tc-bg: light-dark(#fff, #202124); --tc-fg: light-dark(#253043, #e4e7ee); --tc-muted: light-dark(#657187, #b3bac8); --tc-border: light-dark(#c7ccd5, #626977); --tc-primary: light-dark(#6554e8, #b6aaff); --tc-error: light-dark(#ad2537, #ff9da8); background: var(--tc-bg); color: var(--tc-fg); border: 1px solid var(--tc-border); border-radius: 8px; padding: 18px 16px 12px; font: 14px/1.5 Roboto, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; box-sizing: border-box; }
  #tc-single-row .tc-header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-right: 76px; margin-bottom: 18px; font-weight: 500; }
  #tc-single-row .tc-example { font-size: 12px; font-weight: 400; color: var(--tc-muted); }
  #tc-single-row .tc-scroll { overflow-x: auto; overscroll-behavior-x: contain; padding: 10px 1px 14px; }
  #tc-single-row .tc-line { display: flex; flex-wrap: nowrap; gap: 10px; align-items: center; width: 100%; min-width: 1080px; }
  #tc-single-row .tc-field { display: block; position: relative; flex: 1 0 90px; min-width: 90px; }
  #tc-single-row .tc-name { flex-basis: 172px; min-width: 172px; }
  #tc-single-row .tc-kind { flex-basis: 76px; min-width: 76px; }
  #tc-single-row .tc-mu { flex-basis: 90px; min-width: 90px; }
  #tc-single-row .tc-lambda { flex-basis: 106px; min-width: 106px; }
  #tc-single-row .tc-pair { --tc-field-bg: light-dark(#f4f3ff, #302c43); display: flex; align-items: center; gap: 8px; flex: 2 0 210px; min-width: 210px; padding: 14px 8px; border: none; border-radius: 8px; background: var(--tc-field-bg); box-sizing: border-box; }
  #tc-single-row .tc-label { position: absolute; top: -9px; left: 9px; padding: 0 4px; background: var(--tc-field-bg, var(--tc-bg)); color: var(--tc-primary); font-size: 12px; white-space: nowrap; }
  #tc-single-row input:not([type=checkbox]), #tc-single-row select { display: block; box-sizing: border-box; width: 100%; min-width: 0; height: 44px; padding: 9px 11px; border: 1px solid var(--tc-border); border-radius: 6px; background: var(--tc-field-bg, var(--tc-bg)); color: var(--tc-fg); font: inherit; }
  #tc-single-row input:focus, #tc-single-row select:focus { border-color: var(--tc-primary); }
  #tc-single-row input.tc-with-unit { padding-right: 26px; }
  #tc-single-row .tc-unit { position: absolute; top: 11px; right: 10px; color: var(--tc-muted); pointer-events: none; }
  #tc-single-row .tc-check { display: flex; flex: 0 0 90px; min-height: 44px; align-items: center; gap: 6px; white-space: nowrap; margin-left: 2px; }
  #tc-single-row input[type=checkbox] { width: 18px; height: 18px; margin: 0; accent-color: var(--tc-primary); }
  #tc-single-row .tc-warning { color: var(--tc-error); margin: 4px 0 0; font-size: 12px; }
  #tc-single-row [hidden] { display: none !important; }
  @media (pointer: coarse) { #tc-single-row input:not([type=checkbox]), #tc-single-row select { font-size: 16px; } }
</style>
<div id="tc-single-row" class="viz-dotted-background">
  <section class="tc-window" aria-label="超导性质全部单行布局">
    <div class="tc-header">预测 Tc · allen_dynes <span class="tc-example">示例数据</span></div>
    <div class="tc-scroll" role="region" aria-label="超导性质单行输入，可横向滚动">
      <div class="tc-line">
        <label class="tc-field tc-lambda"><span class="tc-label">电声耦合强度 λ</span><input data-field="lambda" aria-label="电声耦合强度 λ" inputmode="decimal" placeholder="填写 λ"></label>
        <label class="tc-field"><span class="tc-label">ωlog</span><input data-field="omega" class="tc-with-unit" aria-label="ωlog (K)" inputmode="decimal" placeholder="填写"><span class="tc-unit">K</span></label>
        <label class="tc-field tc-name"><span class="tc-label">名称</span><input data-field="name" aria-label="名称" value="critical temperature"></label>
        <label class="tc-field tc-kind"><span class="tc-label">值类型</span><select data-field="kind" class="cursor-interaction" aria-label="值类型"><option value="range">范围</option><option value="number">数值</option></select></label>
        <div class="tc-pair" role="group" aria-label="第一组 Tc 与 μ*">
          <label class="tc-field"><span class="tc-label">Tc</span><input data-field="firstTc" class="tc-with-unit" aria-label="第一组 Tc" inputmode="decimal" value="281"><span class="tc-unit">K</span></label>
          <label class="tc-field tc-mu"><span class="tc-label">μ*</span><input data-field="firstMu" aria-label="第一组 μ*" inputmode="decimal" value="0.13"></label>
        </div>
        <div class="tc-pair" role="group" aria-label="第二组 Tc 与 μ*" data-range-only>
          <label class="tc-field"><span class="tc-label">Tc</span><input data-field="secondTc" class="tc-with-unit" aria-label="第二组 Tc" inputmode="decimal" value="311"><span class="tc-unit">K</span></label>
          <label class="tc-field tc-mu"><span class="tc-label">μ*</span><input data-field="secondMu" aria-label="第二组 μ*" inputmode="decimal" value="0.10"></label>
        </div>
        <label class="tc-check cursor-interaction"><input data-field="representative" type="checkbox">代表结果</label>
      </div>
    </div>
    <p class="tc-warning" role="alert" hidden></p>
  </section>
</div>
<script>
(() => {
  const root = document.getElementById('tc-single-row');
  const defaults = { name: 'critical temperature', kind: 'range', firstTc: '281', firstMu: '0.13', secondTc: '311', secondMu: '0.10', lambda: '', omega: '', representative: false };
  const state = { ...defaults };
  const restore = saved => {
    const values = saved && saved.modelContent && saved.modelContent.tcPairedRow;
    if (!values || typeof values !== 'object') return;
    Object.keys(defaults).forEach(key => { if (typeof values[key] === typeof defaults[key]) state[key] = values[key]; });
    if (!['range', 'number'].includes(state.kind)) state.kind = 'range';
  };
  restore(window.openai && window.openai.widgetState);
  const render = () => {
    root.querySelectorAll('[data-field]').forEach(input => {
      const value = state[input.dataset.field];
      if (input.type === 'checkbox') input.checked = value;
      else if (input.value !== value) input.value = value;
    });
    const range = state.kind === 'range';
    root.querySelectorAll('[data-range-only]').forEach(field => { field.hidden = !range; });
    const keys = range ? ['firstTc', 'firstMu', 'secondTc', 'secondMu', 'lambda', 'omega'] : ['firstTc', 'firstMu', 'lambda', 'omega'];
    let warning = keys.some(key => state[key].trim() && (!Number.isFinite(Number(state[key])) || Number(state[key]) < 0)) ? '请输入有效的非负数值。' : '';
    if (!warning && range && ['firstTc', 'firstMu', 'secondTc', 'secondMu'].every(key => state[key].trim())
      && (Number(state.firstTc) - Number(state.secondTc)) * (Number(state.firstMu) - Number(state.secondMu)) > 0) warning = '两组 Tc 与 μ* 的对应关系不一致，请检查输入。';
    const message = root.querySelector('.tc-warning');
    message.textContent = warning;
    message.hidden = !warning;
  };
  // 输入按配对保留；上下界仅在内部推导，不重排正在编辑的输入框。
  const canonicalValues = () => {
    const number = key => state[key].trim() !== '' && Number.isFinite(Number(state[key])) && Number(state[key]) >= 0 ? Number(state[key]) : null;
    if (state.kind === 'number') return { value_number: number('firstTc'), mu_star: number('firstMu') };
    const pairs = [{ tc: number('firstTc'), mu: number('firstMu') }, { tc: number('secondTc'), mu: number('secondMu') }];
    if (pairs.some(pair => pair.tc === null)) return null;
    pairs.sort((left, right) => left.tc - right.tc);
    if (pairs.every(pair => pair.mu !== null) && pairs[0].mu < pairs[1].mu) return null;
    return { value_min: pairs[0].tc, mu_star_max: pairs[0].mu, value_max: pairs[1].tc, mu_star_min: pairs[1].mu };
  };
  root.addEventListener('input', event => {
    const input = event.target.closest('[data-field]');
    if (!input) return;
    state[input.dataset.field] = input.type === 'checkbox' ? input.checked : input.value;
    render();
    if (window.openai && window.openai.setWidgetState) window.openai.setWidgetState({ modelContent: { tcPairedRow: { ...state }, canonical: canonicalValues() }, privateContent: null }).catch(() => {});
  });
  window.addEventListener('openai:set_globals', event => {
    if (event.detail && event.detail.globals && event.detail.globals.widgetState) { restore(event.detail.globals.widgetState); render(); }
  });
  render();
})();
</script>
