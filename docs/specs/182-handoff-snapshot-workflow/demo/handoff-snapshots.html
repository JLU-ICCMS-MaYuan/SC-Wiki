<p class="footnote">字段侧栏只保留“字段设置／来源核对”。整稿交接记录在页面标题旁进入，不放在字段侧栏。</p>

  s4:{id:'S4',tc:220,mu:'0.13',person:'审核员 · 王老师',time:'2026-10-24 16:40',status:'审核通过',location:'演示正文 · 第 4 页 · Table 1 · 第二行及表注',quote:'演示数据：μ*=0.13，Tc=220 K；方法详见表注。此句不是论文原文。',reason:'审核员补全表注证据，保留已经确认的数值。',result:'批准时的核对结果（演示）：通过。'},

const handoffs = [
  {time:'2026-10-29 15:05',from:'王老师（审核员）',to:'陈同学（上传者）',action:'修订退回',snapshot:'s6',fresh:true,note:'审核员修改内容后交回，等待上传者确认。'},
  {time:'2026-10-28 11:15',from:'陈同学（上传者）',to:'王老师（审核员）',action:'修订送审',snapshot:'s5',fresh:true,note:'上传者交出后即失去编辑权。'},
  {time:'2026-10-27 09:00',from:'王老师（审核员）',to:'陈同学（上传者）',action:'公开后交还修订',snapshot:'s4',fresh:false,note:'字段与证据没有改动，沿用 S4，只增加交接记录。'},
  {time:'2026-10-24 16:40',from:'王老师（审核员）',to:'公开数据库',action:'审核通过并发布',snapshot:'s4',fresh:true,note:'补全证据后批准，S4 成为当前公开版。'},
  {time:'2026-10-23 10:00',from:'陈同学（上传者）',to:'王老师（审核员）',action:'再次送审',snapshot:'s3',fresh:true,note:'更正数值配对后重新提交。'},
  {time:'2026-10-22 14:30',from:'王老师（审核员）',to:'陈同学（上传者）',action:'审核退回',snapshot:'s2',fresh:true,note:'审核员修改字段后退回。'},
  {time:'2026-10-21 09:20',from:'陈同学（上传者）',to:'王老师（审核员）',action:'首次送审',snapshot:'s1',fresh:true,note:'首次交出形成 S1。'}
];
const app = document.getElementById('app');
const newTab = 'target="_blank" rel="noopener"';
let activeSnapshot = null;
let previousFocus = null;
function field(label,value,wide=false){return `<label class="field${wide?' wide':''}"><span>${label}</span><input readonly value="${value}"></label>`;}
function paperForm(snapshot){return `<section class="panel"><div class="panel-title"><h2>论文信息</h2><span class="muted">沿用现有表单分区</span></div><div class="grid">${field('论文标题','La–Sc–H 超导研究（演示稿件）',true)}${field('作者','陈同学 等')}${field('期刊','演示期刊')}${field('年份','2026')}${field('DOI','演示稿件，无真实 DOI')}${field('论文类型','理论研究')}${field('研究方法','第一性原理计算')}<label class="field wide"><span>摘要</span><textarea readonly>用于展示整稿快照入口、版本信息和当时字段证据的模拟表单。此处数值与文献信息不对应真实论文。</textarea></label></div></section>
<section class="panel"><div class="panel-title"><h2>材料状态 01 · La–Sc–H</h2><span class="badge">材料状态示意</span></div><div class="grid">${field('材料名','La–Sc–H')}${field('压强','200 GPa（演示）')}${field('空间群','本演示未填写')}${field('结构优化','沿用原表单内容')}${field('电子结构方法','DFT（演示）')}${field('声子方法','DFPT（演示）')}</div>
<div class="section"><h3>电子性质 / 动力学性质</h3><p class="muted" style="margin-top:8px">实际页面继续使用原表单各模块；本 demo 未展开所有物性参数。</p></div>
<div class="section"><div class="panel-title"><h3>超导性质</h3><span class="muted">原字段侧栏入口继续保留</span></div><div class="grid">${field('Tc 计算方法','各向同性 Migdal–Eliashberg（演示）')}${field('μ*',snapshot.mu)}<label class="field"><span><button class="text-link" data-open-evidence aria-label="查看 Tc 的来源核对">Tc · 查看来源 ↗</button><span class="badge ${snapshot.id==='S4'?'public':'wait'}">${snapshot.id==='S4'?'已通过':'随稿核对状态'}</span></span><input readonly value="${snapshot.tc} K"></label>${field('λ','1.50（演示）')}${field('ωlog','900 K（演示）')}${field('计算条件','共用资料区（布局示意）')}</div></div></section>`;}
function renderEntry(){activeSnapshot=null;app.innerHTML=`<div class="crumb">上传记录 / 论文校对</div><div class="row spread title"><div><h1>核对解析稿件</h1><p class="muted" style="margin-top:7px">La–Sc–H 超导研究（演示稿件）</p></div><div class="toolbar"><span class="badge">当前经手人：陈同学</span><a class="button" href="#handoffs" ${newTab}>交接记录与快照 ↗</a></div></div>
<div class="notice"><strong>入口放在整份稿件的标题旁。</strong> 上传校对页、返修页、管理员／超级管理员审核页，在各自原有标题操作区提供同名入口。字段侧栏不再提供“历史”页签。</div>
<div class="row spread"><p class="muted">当前工作稿 · 基于退回的 S6；本页只演示位置，不执行编辑或保存。</p><a href="#snapshot=s4" ${newTab}>查看当前公开版 S4 ↗</a></div>
${paperForm({...snapshots.s6,tc:216,id:'工作稿'})}<div class="readonly">此稿件已经正式退回陈同学手中，因此可在真实系统继续编辑；交出成功后，原经手人须等待其他合法经手人退回，才能再次编辑。</div><p class="footnote">点击 Tc 的“查看来源”可预览只含两个页签的侧栏。此布局演示不替代生产页面的全部细节。</p>`;}
function renderHandoffs(){activeSnapshot=null;app.innerHTML=`<div class="crumb">La–Sc–H 超导研究 / 整稿记录</div><div class="row spread title"><div><h1>交接记录与快照</h1><p class="muted" style="margin-top:7px">按正式交接查看整份稿件；编辑过程中的反复输入不出现在这里。</p></div><a class="button" href="#entry">查看入口位置</a></div>
<div class="summary"><div><small>当前公开版本</small><strong><a href="#snapshot=s4" ${newTab}>S4 · 已批准 ↗</a></strong></div><div><small>最新交出的内容快照</small><strong><a href="#snapshot=s6" ${newTab}>S6 · 已退回上传者 ↗</a></strong></div><div><small>当前工作稿</small><strong>陈同学持有 · 基于 S6 修订</strong></div></div>
<div class="notice green">修订期间继续公开 S4。S5、S6 尚未成为新的批准版，不替换公开内容。</div>
<div class="history-card"><div class="table-wrap"><table><caption class="sr-only">正式交接记录，最新在前</caption><thead><tr><th>交接时间</th><th>交出人 → 接收对象</th><th>处理决定</th><th>内容快照</th><th>查看</th></tr></thead><tbody>${handoffs.map((item,index)=>`<tr><td>${item.time}</td><td>${item.from}<br>→ ${item.to}</td><td>${item.action}<small>${item.note}</small></td><td><strong>${snapshots[item.snapshot].id}</strong><small>${item.fresh?'新内容快照':'沿用已有快照'}</small></td><td><a href="#snapshot=${item.snapshot}&handoff=${index}" ${newTab} aria-label="查看${item.time}交接的${snapshots[item.snapshot].id}整稿">查看整稿 ↗</a></td></tr>`).join('')}</tbody></table></div></div>

function renderSnapshot(key,contextIndex){const snapshot=snapshots[key];if(!snapshot){app.innerHTML='<h1>未找到这份演示快照</h1><p><a href="#handoffs">返回交接记录</a></p>';return;}activeSnapshot=snapshot;const index=contextIndex===null?null:Number(contextIndex);const context=index!==null&&Number.isInteger(index)&&handoffs[index]?.snapshot===key?handoffs[index]:null;
app.innerHTML=`<div class="crumb">La–Sc–H 超导研究 / <a href="#handoffs">交接记录与快照</a> / ${snapshot.id}</div><div class="row spread title"><div class="row"><h1>整稿快照 ${snapshot.id}</h1><span class="badge">只读</span>${key==='s4'?'<span class="badge public">当前公开版</span>':''}</div><a class="button" href="#handoffs">交接记录与快照</a></div>
<div class="readonly"><strong>这是当时交出去的完整版本，不能在这里修改。</strong> 当前工作稿怎么改，都不会改变这份快照中的值、证据和理由。</div>
<section class="panel"><h2>版本信息</h2><div class="info-grid"><div><small>内容快照形成时刻</small>${snapshot.time}</div><div><small>形成快照的经手人</small>${snapshot.person}</div><div><small>形成快照时的处理</small>${snapshot.status}</div><div><small>当前公开状态</small>${key==='s4'?'仍在公开，等待修订稿批准':'非当前公开版'}</div></div>${context?`<div class="section"><small>这次查看对应的交接（与内容快照分开）</small><p>${context.time} · ${context.from} → ${context.to} · ${context.action}</p><p class="muted">${context.fresh?'本次形成新快照':'本次内容没有变化，沿用已有快照'}；${context.note}</p></div>`:''}</section>
<div class="row spread"><p class="muted">沿用整稿表单布局；字段侧栏读取 ${snapshot.id} 当时的资料。</p><div class="snapshot-links" aria-label="切换演示快照">${Object.entries(snapshots).map(([id,s])=>`<a href="#snapshot=${id}" ${id===key?'aria-current="page"':''}>${s.id}</a>`).join('')}</div></div>
${paperForm(snapshot)}<p class="footnote">本 demo 用代表性表单字段展示阅读方式；真实快照应保留整份表单及随稿证据。打开快照不触发模型核对，不提供“直接编辑历史”或“自行取回”按钮。</p>`;}

function selectTab(kind,focus=false){for(const name of ['settings','source']){const tab=document.getElementById(`${name}-tab`);tab.setAttribute('aria-selected',String(name===kind));tab.tabIndex=name===kind?0:-1;document.getElementById(`${name}-panel`).hidden=name!==kind;if(name===kind&&focus)tab.focus();}}
function openDrawer(){previousFocus=document.activeElement;const snapshot=activeSnapshot||{...snapshots.s6,id:'当前工作稿',tc:216,result:'当前值修改为 216 K 后尚待核对（演示）；打开侧栏不会调用模型。'};document.getElementById('drawer-context').textContent=`${snapshot.id} · 材料状态 01 → Tc 方法 → μ*=${snapshot.mu} 对应的 Tc`;
document.getElementById('evidence-location').textContent=snapshot.location;document.getElementById('evidence-quote').textContent=snapshot.quote;document.getElementById('evidence-reason').textContent=snapshot.reason;document.getElementById('evidence-result').textContent=snapshot.result;selectTab('source');drawer.hidden=false;veil.hidden=false;document.body.style.overflow='hidden';document.getElementById('close').focus();}
function closeDrawer(){drawer.hidden=true;veil.hidden=true;document.body.style.overflow='';if(previousFocus?.isConnected)previousFocus.focus();}
function render(){if(!drawer.hidden)closeDrawer();const route=location.hash.slice(1)||'entry';const params=new URLSearchParams(route);const section=route==='entry'?'entry':route==='handoffs'?'handoffs':'snapshot';for(const link of document.querySelectorAll('[data-route]')){if(link.dataset.route===section)link.setAttribute('aria-current','page');else link.removeAttribute('aria-current');}if(section==='entry')renderEntry();else if(section==='handoffs')renderHandoffs();else renderSnapshot(params.get('snapshot'),params.get('handoff'));document.title=`${section==='entry'?'入口位置':section==='handoffs'?'交接记录':activeSnapshot?.id||'快照'} · 整稿快照方案演示`;window.scrollTo(0,0);}
app.addEventListener('click',event=>{if(event.target.closest('[data-open-evidence]'))openDrawer();});
document.getElementById('close').addEventListener('click',closeDrawer);veil.addEventListener('click',closeDrawer);
for(const name of ['settings','source'])document.getElementById(`${name}-tab`).addEventListener('click',()=>selectTab(name));
document.addEventListener('keydown',event=>{if(drawer.hidden)return;if(event.key==='Escape'){event.preventDefault();closeDrawer();return;}if(event.target.getAttribute('role')==='tab'&&['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){event.preventDefault();selectTab(event.key==='Home'?'settings':event.key==='End'?'source':event.target.id==='source-tab'?'settings':'source',true);return;}if(event.key==='Tab'){const nodes=[...drawer.querySelectorAll('button:not([disabled]):not([tabindex="-1"]),a[href],summary,[tabindex="0"]')].filter(node=>node.getClientRects().length);const first=nodes[0],last=nodes[nodes.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
window.addEventListener('hashchange',render);render();
</script>
